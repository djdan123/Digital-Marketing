<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Manager - Statistiques</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: { 500: '#2563eb', 600: '#1d4ed8' } } } } };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="sidebar-container"></div>

    <main class="min-h-screen p-4 sm:ml-64">
        <div class="mb-6">
            <h1 class="text-2xl font-semibold text-white">Statistiques</h1>
            <p class="mt-1 text-sm text-slate-400">Analyse de votre activité média.</p>
        </div>

        <div class="grid gap-4 md:grid-cols-3">
            <div class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><p class="text-sm text-slate-400">Nombre de demandes</p><p id="requests-count" class="mt-3 text-3xl font-semibold text-white">—</p></div>
            <div class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><p class="text-sm text-slate-400">Taux d’acceptation</p><p id="acceptance-rate" class="mt-3 text-3xl font-semibold text-white">—</p></div>
            <div class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><p class="text-sm text-slate-400">Nombre de diffusions</p><p id="broadcasts-count" class="mt-3 text-3xl font-semibold text-white">—</p></div>
        </div>

        <div class="mt-8 grid gap-6 xl:grid-cols-[1.2fr_0.8fr]">
            <div class="rounded-2xl border border-slate-800 bg-slate-900 p-6">
                <h2 class="text-lg font-semibold text-white">Évolution des diffusions</h2>
                <div id="line-chart" class="mt-4"></div>
            </div>
            <div class="rounded-2xl border border-slate-800 bg-slate-900 p-6">
                <h2 class="text-lg font-semibold text-white">Répartition</h2>
                <div id="bar-chart" class="mt-4"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { initMediaManagerPage, createEmptyState } from '../assets/js/media-manager.js';
        import api from '../assets/js/api.js';

        await initMediaManagerPage();

        async function loadStats() {
            try {
                const response = await api.get('/media-manager/statistics');
                const stats = response.data?.data || response.data || {};
                document.getElementById('requests-count').textContent = stats.requests_count || 0;
                document.getElementById('acceptance-rate').textContent = stats.acceptance_rate ? `${stats.acceptance_rate}%` : '0%';
                document.getElementById('broadcasts-count').textContent = stats.broadcasts_count || 0;

                renderCharts(stats.series || []);
            } catch (error) {
                document.getElementById('requests-count').textContent = '0';
                document.getElementById('acceptance-rate').textContent = '0%';
                document.getElementById('broadcasts-count').textContent = '0';
                document.getElementById('line-chart').innerHTML = createEmptyState('Statistiques non disponibles.');
                document.getElementById('bar-chart').innerHTML = createEmptyState('Statistiques non disponibles.');
            }
        }

        function renderCharts(series) {
            const labels = series.length ? series.map(item => item.label || 'N/A') : ['S1', 'S2', 'S3', 'S4'];
            const values = series.length ? series.map(item => item.value || 0) : [0, 0, 0, 0];

            const line = new ApexCharts(document.getElementById('line-chart'), {
                chart: { type: 'line', height: 240, toolbar: { show: false } },
                series: [{ name: 'Diffusions', data: values }],
                xaxis: { categories: labels },
                colors: ['#3b82f6']
            });
            line.render();

            const bar = new ApexCharts(document.getElementById('bar-chart'), {
                chart: { type: 'bar', height: 240, toolbar: { show: false } },
                series: [{ name: 'Demandes', data: values }],
                xaxis: { categories: labels },
                colors: ['#60a5fa']
            });
            bar.render();
        }

        loadStats();
    </script>
</body>
</html>
