<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Manager - Planning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: { 500: '#2563eb', 600: '#1d4ed8' } } } } };
    </script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="sidebar-container"></div>

    <main class="min-h-screen p-4 sm:ml-64">
        <div class="mb-6">
            <h1 class="text-2xl font-semibold text-white">Planning</h1>
            <p class="mt-1 text-sm text-slate-400">Créneaux confirmés et modification des diffusions.</p>
        </div>

        <div id="schedule-list" class="space-y-3"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { initMediaManagerPage, createEmptyState, formatDate } from '../assets/js/media-manager.js';
        import api from '../assets/js/api.js';

        await initMediaManagerPage();

        async function loadSchedule() {
            try {
                const response = await api.get('/media-manager/schedules');
                const schedules = response.data?.data || response.data || [];
                renderSchedule(schedules);
            } catch (error) {
                document.getElementById('schedule-list').innerHTML = createEmptyState('Endpoint non disponible pour le planning.');
            }
        }

        function renderSchedule(schedules) {
            const container = document.getElementById('schedule-list');
            if (!schedules.length) {
                container.innerHTML = createEmptyState('Aucun créneau confirmé.');
                return;
            }

            container.innerHTML = schedules.map(schedule => `
                <div class="rounded-2xl border border-slate-800 bg-slate-900/80 p-4">
                    <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
                        <div>
                            <p class="text-sm font-semibold text-white">${schedule.title || 'Créneau'}</p>
                            <p class="mt-1 text-sm text-slate-400">Début : ${formatDate(schedule.start_at)} · Fin : ${formatDate(schedule.end_at)}</p>
                        </div>
                        <button data-id="${schedule.id}" class="edit-btn rounded-lg border border-slate-700 px-3 py-2 text-sm text-slate-300 hover:border-blue-500 hover:text-white">Modifier</button>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.edit-btn').forEach(button => {
                button.addEventListener('click', async () => {
                    const id = button.getAttribute('data-id');
                    const start = prompt('Nouvelle date/heure de début (ISO)');
                    if (!start) return;
                    const end = prompt('Nouvelle date/heure de fin (ISO)');
                    if (!end) return;
                    try {
                        await api.put(`/mediamanager/schedules/${id}`, { start_at: start, end_at: end });
                        await loadSchedule();
                    } catch (error) {
                        alert('Impossible de modifier le créneau.');
                    }
                });
            });
        }

        loadSchedule();
    </script>
</body>
</html>
