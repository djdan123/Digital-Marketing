<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Manager - Preuve de diffusion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: { 500: '#2563eb', 600: '#1d4ed8' } } } } };
    </script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="sidebar-container"></div>

    <main class="min-h-screen p-4 sm:ml-64">
        <div id="proof-content" class="rounded-2xl border border-slate-800 bg-slate-900/90 p-6"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { initMediaManagerPage, createEmptyState, formatDate } from '../assets/js/media-manager.js';
        import api from '../assets/js/api.js';
        import { uploadFileSafe } from '../assets/js/upload.js';

        await initMediaManagerPage();

        const params = new URLSearchParams(window.location.search);
        const broadcastId = params.get('id');

        if (!broadcastId) {
            document.getElementById('proof-content').innerHTML = createEmptyState('Aucune diffusion sélectionnée.');
        } else {
            await loadBroadcast(broadcastId);
        }

        async function loadBroadcast(id) {
            try {
                const response = await api.get(`/mediamanager/broadcasts/${id}`);
                const broadcast = response.data?.data || response.data || {};
                renderBroadcast(broadcast);
            } catch (error) {
                document.getElementById('proof-content').innerHTML = createEmptyState('Endpoint non disponible pour cette diffusion.');
            }
        }

        function renderBroadcast(broadcast) {
            const content = document.getElementById('proof-content');
            content.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <h1 class="text-2xl font-semibold text-white">Preuve de diffusion</h1>
                        <p class="mt-1 text-sm text-slate-400">${broadcast.title || 'Diffusion'}</p>
                    </div>
                    <div class="rounded-xl border border-slate-800 bg-slate-800/60 p-4 text-sm text-slate-400">
                        <p><span class="text-slate-500">Date prévue :</span> ${formatDate(broadcast.broadcasted_at || broadcast.start_at)}</p>
                        <p class="mt-2"><span class="text-slate-500">Statut actuel :</span> ${broadcast.status || 'scheduled'}</p>
                    </div>
                    <form id="proof-form" class="space-y-3 rounded-xl border border-slate-800 bg-slate-800/60 p-4">
                        <input id="proof-file" type="file" class="w-full rounded-lg border border-slate-700 bg-slate-900 p-2 text-sm text-slate-300" />
                        <textarea id="proof-comment" rows="3" class="w-full rounded-lg border border-slate-700 bg-slate-900 p-2 text-sm text-white" placeholder="Commentaire optionnel..."></textarea>
                        <div class="flex items-center gap-3">
                            <button type="submit" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white">Envoyer la preuve</button>
                            <button id="complete-btn" type="button" class="rounded-lg border border-slate-700 px-4 py-2 text-sm text-slate-300">Marquer comme terminée</button>
                        </div>
                    </form>
                </div>
            `;

            document.getElementById('proof-form').addEventListener('submit', async (event) => {
                event.preventDefault();
                const file = document.getElementById('proof-file').files[0];
                const comment = document.getElementById('proof-comment').value;
                if (!file) {
                    alert('Veuillez joindre un fichier de preuve.');
                    return;
                }
                try {
                    const uploaded = await uploadFileSafe(file, 'video');
                    await api.post(`/media-manager/broadcasts/${broadcast.id}/proof`, { file: uploaded.path || uploaded.url || uploaded.name, comment });
                    alert('Preuve envoyée.');
                } catch (error) {
                    alert('Impossible d’envoyer la preuve.');
                }
            });

            document.getElementById('complete-btn').addEventListener('click', async () => {
                if (!confirm('Confirmer la fin de cette diffusion ?')) return;
                try {
                    await api.put(`/media-manager/broadcasts/${broadcast.id}/complete`);
                    alert('Diffusion terminée.');
                } catch (error) {
                    alert('Impossible de terminer la diffusion.');
                }
            });
        }
    </script>
</body>
</html>
