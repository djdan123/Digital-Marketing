<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Manager - Diffusions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: { 500: '#2563eb', 600: '#1d4ed8' } } } } };
    </script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="sidebar-container"></div>

    <main class="min-h-screen p-4 sm:ml-64">
        <div class="mb-6 flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
            <div>
                <h1 class="text-2xl font-semibold text-white">Diffusions</h1>
                <p class="mt-1 text-sm text-slate-400">Suivi des diffusions prévues, en cours et terminées.</p>
            </div>
            <div class="flex flex-wrap gap-2">
                <button data-filter="all" class="filter-btn rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-300">Toutes</button>
                <button data-filter="scheduled" class="filter-btn rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-300">Prévue</button>
                <button data-filter="in_progress" class="filter-btn rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-300">En cours</button>
                <button data-filter="completed" class="filter-btn rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-300">Terminée</button>
            </div>
        </div>

        <div id="broadcasts-list" class="space-y-3"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { initMediaManagerPage, getStatusBadgeClass, getStatusLabel, createEmptyState, formatDate } from '../assets/js/media-manager.js';
        import api from '../assets/js/api.js';

        await initMediaManagerPage();

        let broadcasts = [];
        let activeFilter = 'all';

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                activeFilter = btn.dataset.filter;
                renderBroadcasts();
            });
        });

        async function loadBroadcasts() {
            try {
                const response = await api.get('/media-manager/broadcasts');
                broadcasts = response.data?.data || response.data || [];
                renderBroadcasts();
            } catch (error) {
                document.getElementById('broadcasts-list').innerHTML = createEmptyState('Endpoint non disponible pour les diffusions.');
            }
        }

        function renderBroadcasts() {
            const filtered = activeFilter === 'all' ? broadcasts : broadcasts.filter(item => item.status === activeFilter);
            const container = document.getElementById('broadcasts-list');
            if (!filtered.length) {
                container.innerHTML = createEmptyState('Aucune diffusion à afficher.');
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="rounded-2xl border border-slate-800 bg-slate-900/80 p-4">
                    <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="text-sm font-semibold text-white">${item.title || 'Diffusion'}</h3>
                                <span class="rounded-full border px-2.5 py-1 text-xs ${getStatusBadgeClass(item.status)}">${getStatusLabel(item.status)}</span>
                            </div>
                            <p class="mt-2 text-sm text-slate-400">Prévue le ${formatDate(item.broadcasted_at || item.start_at)}</p>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            <button data-action="start" data-id="${item.id}" class="rounded-lg border border-slate-700 px-3 py-2 text-sm text-slate-300 hover:border-blue-500 hover:text-white">Marquer en cours</button>
                            <a href="/mediamanager/broadcast-proof.html?id=${item.id}" class="rounded-lg border border-slate-700 px-3 py-2 text-sm text-slate-300 hover:border-blue-500 hover:text-white">Ajouter preuve</a>
                        </div>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('[data-action="start"]').forEach(button => {
                button.addEventListener('click', async () => {
                    const id = button.getAttribute('data-id');
                    try {
                        await api.put(`/mediamanager/broadcasts/${id}/complete`, { status: 'in_progress' });
                        await loadBroadcasts();
                    } catch (error) {
                        alert('Impossible de marquer cette diffusion en cours.');
                    }
                });
            });
        }

        loadBroadcasts();
    </script>
</body>
</html>
