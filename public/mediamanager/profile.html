<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Manager - Profil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: { 500: '#2563eb', 600: '#1d4ed8' } } } } };
    </script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="sidebar-container"></div>

    <main class="min-h-screen p-4 sm:ml-64">
        <div class="mx-auto max-w-3xl rounded-2xl border border-slate-800 bg-slate-900/90 p-6">
            <h1 class="text-2xl font-semibold text-white">Mon profil</h1>
            <p class="mt-1 text-sm text-slate-400">Informations personnelles et sécurité du compte.</p>

            <div id="profile-card" class="mt-6 space-y-4"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { initMediaManagerPage, createEmptyState } from '../assets/js/media-manager.js';
        import api from '../assets/js/api.js';
        import { logout } from '../assets/js/auth.js';

        await initMediaManagerPage();

        async function loadProfile() {
            try {
                const response = await api.get('/media-manager/profile');
                const profile = response.data?.data || response.data || {};
                document.getElementById('profile-card').innerHTML = `
                    <div class="rounded-xl border border-slate-800 bg-slate-800/60 p-4">
                        <p class="text-sm text-slate-400">Nom</p>
                        <p class="mt-1 text-base font-semibold text-white">${profile.name || '—'}</p>
                    </div>
                    <div class="rounded-xl border border-slate-800 bg-slate-800/60 p-4">
                        <p class="text-sm text-slate-400">Email</p>
                        <p class="mt-1 text-base font-semibold text-white">${profile.email || '—'}</p>
                    </div>
                    <div class="rounded-xl border border-slate-800 bg-slate-800/60 p-4">
                        <p class="text-sm text-slate-400">Média associé</p>
                        <p class="mt-1 text-base font-semibold text-white">${profile.media?.name || 'Aucun média associé'}</p>
                    </div>
                    <div class="flex gap-3">
                        <button id="logout-btn" class="rounded-lg border border-slate-700 px-4 py-2 text-sm text-slate-300 hover:border-red-500 hover:text-red-300">Déconnexion</button>
                    </div>
                `;
                document.getElementById('logout-btn').addEventListener('click', logout);
            } catch (error) {
                document.getElementById('profile-card').innerHTML = createEmptyState('Profil indisponible.');
            }
        }

        loadProfile();
    </script>
</body>
</html>
