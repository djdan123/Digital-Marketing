<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inscription â€” TruckAll Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet">
<link href="/admin/assets/css/app.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 antialiased">
<div class="flex min-h-screen items-center justify-center p-4">
  <div class="w-full max-w-md p-6 bg-white rounded-lg shadow dark:bg-gray-800">
    <h1 class="text-xl font-bold text-center mb-6">Inscription</h1>
    <div id="auth-error" class="hidden mb-4 p-3 text-sm text-red-700 bg-red-100 rounded-lg"></div>
    <form id="auth-form" class="space-y-4">
      <div><label class="block mb-2 text-sm">Nom</label><input type="text" name="name" required class="w-full rounded-lg border-gray-300 dark:bg-gray-700"></div>
      <div><label class="block mb-2 text-sm">Email</label><input type="email" name="email" required class="w-full rounded-lg border-gray-300 dark:bg-gray-700"></div>
      <div><label class="block mb-2 text-sm">Mot de passe</label><input type="password" name="password" required class="w-full rounded-lg border-gray-300 dark:bg-gray-700"></div>
      <button type="submit" class="w-full text-white bg-blue-700 rounded-lg py-2.5">S'inscrire</button>
    </form>
    <p class="mt-4 text-sm text-center"><a href="login.html" class="text-blue-600 hover:underline">DÃ©jÃ  un compte ?</a></p>
  </div>
</div>
<script type="module">
import api from './assets/js/api.js';
import { setToken, setUser, redirectIfAuthenticated } from './assets/js/auth.js';
redirectIfAuthenticated();
document.getElementById('auth-form')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const err = document.getElementById('auth-error');
  try {
    const { data } = await api.post('/register', Object.fromEntries(fd));
    setToken(data.token);
    setUser(data.user);
    window.location.href = 'index.html';
  } catch (error) {
    err.classList.remove('hidden');
    err.textContent = error.response?.data?.message || 'Inscription impossible.';
  }
});
</script>
</body>
</html>
