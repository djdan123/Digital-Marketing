<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - TruckAll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <link href="/admin/assets/css/app.css" rel="stylesheet" />
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-900 text-gray-100">
    <div class="flex min-h-screen items-center justify-center p-4">
        <div class="w-full max-w-md p-6 bg-gray-800 rounded-lg border border-gray-700">
            <h1 class="text-xl font-bold text-center mb-6 text-white">Inscription</h1>
            <div id="auth-error" class="hidden mb-4 p-3 text-sm text-red-200 bg-red-900/50 border border-red-700 rounded-lg"></div>
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block mb-2 text-sm text-white">Nom</label>
                    <input type="text" name="name" required class="bg-gray-700 border border-gray-600 text-white rounded-lg block w-full p-2.5">
                </div>
                <div>
                    <label class="block mb-2 text-sm text-white">Email</label>
                    <input type="email" name="email" required class="bg-gray-700 border border-gray-600 text-white rounded-lg block w-full p-2.5">
                </div>
                <div>
                    <label class="block mb-2 text-sm text-white">Mot de passe</label>
                    <input type="password" name="password" required class="bg-gray-700 border border-gray-600 text-white rounded-lg block w-full p-2.5">
                </div>
                <button type="submit" class="w-full text-white bg-blue-600 hover:bg-blue-700 rounded-lg py-2.5">S'inscrire</button>
            </form>
            <p class="mt-4 text-sm text-center text-gray-400">
                <a href="/admin/login.html" class="text-blue-400 hover:underline">Déjà un compte ?</a>
            </p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import api from './assets/js/api.js';
        import { setToken, setUser, redirectIfAuthenticated } from './assets/js/auth.js';

        redirectIfAuthenticated();

        document.getElementById('auth-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const err = document.getElementById('auth-error');
            try {
                const { data } = await api.post('/register', Object.fromEntries(fd));
                setToken(data.token);
                setUser(data.user);
                window.location.href = '/admin/index.html';
            } catch (error) {
                err.classList.remove('hidden');
                err.textContent = error.response?.data?.message || 'Inscription impossible.';
            }
        });
    </script>
</body>
</html>
