<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - TruckAll</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <link href="/admin/assets/css/app.css" rel="stylesheet" />

    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-gray-900 text-gray-100">

    <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto min-h-screen">
        <a href="/admin/login.html" class="flex items-center mb-6 text-2xl font-semibold text-white">
            TruckAll
        </a>

        <div class="w-full bg-gray-800 rounded-lg border border-gray-700 shadow sm:max-w-md">
            <div class="p-6 space-y-4 sm:p-8">
                <h1 class="text-xl font-bold text-white">
                    Connectez-vous à votre compte
                </h1>

                <div id="error-message" class="hidden p-4 text-sm text-red-200 rounded-lg bg-red-900/50 border border-red-700" role="alert"></div>

                <form id="login-form" class="space-y-4">
                    <div>
                        <label for="email" class="block mb-2 text-sm font-medium text-white">Email</label>
                        <input type="email" name="email" id="email"
                               class="bg-gray-700 border border-gray-600 text-white rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                               placeholder="name@company.com" required>
                    </div>

                    <div>
                        <label for="password" class="block mb-2 text-sm font-medium text-white">Mot de passe</label>
                        <input type="password" name="password" id="password" placeholder="••••••••"
                               class="bg-gray-700 border border-gray-600 text-white rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                               required>
                    </div>

                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-2 text-sm text-gray-400">
                            <input id="remember" type="checkbox" class="w-4 h-4 rounded bg-gray-700 border-gray-600">
                            Se souvenir de moi
                        </label>
                        <a href="/admin/forgot-password.html" class="text-sm text-blue-400 hover:underline">Mot de passe oublié ?</a>
                    </div>

                    <button type="submit" id="login-btn"
                            class="w-full text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-lg text-sm px-5 py-2.5 disabled:opacity-70">
                        Se connecter
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

   <script type="module">
    import { login, isAuthenticated, getUserRole } from './assets/js/auth.js';

    // Si déjà connecté → rediriger selon le rôle
    if (isAuthenticated()) {
        const role = getUserRole();
        if (role === 'admin') {
            window.location.href = '/admin/index.html';
        } else if (role === 'advertiser' || role === 'annonceur') {
            window.location.href = '/client/dashboard.html';
        } else {
            window.location.href = '/mediamanager/index.html';
        }
    }

    const form = document.getElementById('login-form');
    const errorDiv = document.getElementById('error-message');
    const loginBtn = document.getElementById('login-btn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        loginBtn.disabled = true;
        loginBtn.textContent = 'Connexion...';
        errorDiv.classList.add('hidden');

        const result = await login(email, password);

        if (result.success) {
            const role = result.user?.role;

            // ✅ Redirection selon le rôle
            if (role === 'admin') {
                window.location.href = '/admin/index.html';
            } else if (role === 'advertiser' || role === 'annonceur') {
                window.location.href = '/client/dashboard.html';
            } else if (role === 'media_manager' || role === 'mediamanager') {
                window.location.href = '/mediamanager/index.html';
            } else {
                // Rôle inconnu → déconnecter
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                errorDiv.textContent = 'Accès non autorisé à cette interface.';
                errorDiv.classList.remove('hidden');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Se connecter';
            }
        } else {
            errorDiv.textContent = result.message;
            errorDiv.classList.remove('hidden');
            loginBtn.disabled = false;
            loginBtn.textContent = 'Se connecter';
        }
    });
</script>
</body>
</html>
