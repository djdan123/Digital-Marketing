<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail facture - TruckAll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-900 text-gray-100">
    <div id="sidebar-container"></div>

    <div class="p-4 sm:ml-64">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-white">Détail de la facture</h1>
        </div>

        <div id="content" class="bg-gray-800 rounded-lg border border-gray-700 p-6 max-w-2xl">
            <p class="text-gray-400">Chargement...</p>
        </div>

        <div class="mt-4">
            <a href="/admin/invoices/index.html" class="text-blue-400 hover:text-blue-300 text-sm">← Retour aux factures</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { requireAuth } from '../assets/js/auth.js';
        import api from '../assets/js/api.js';

        requireAuth();
        fetch('/admin/components/sidebar.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar-container').innerHTML = html;
        });

        const id = new URLSearchParams(window.location.search).get('id');
        if (!id) window.location.href = '/admin/invoices/index.html';

        async function load() {
            try {
                const res = await api.get(`/admin/invoices/${id}`).catch(() => ({ data: null }));
                const inv = res.data?.data || res.data;

                if (!inv) {
                    document.getElementById('content').innerHTML = `<p class="text-gray-400">Facture introuvable ou endpoint non disponible.</p>`;
                    return;
                }

                document.getElementById('content').innerHTML = `
                    <div class="space-y-4">
                        <div>
                            <p class="text-sm text-gray-400">Numéro</p>
                            <p class="text-white font-medium">${inv.number || inv.id}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-400">Montant</p>
                            <p class="text-white font-medium">${inv.amount ? inv.amount + ' $' : '—'}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-400">Statut</p>
                            <p class="text-white font-medium">${inv.status || '—'}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-400">Date</p>
                            <p class="text-white font-medium">${inv.created_at ? new Date(inv.created_at).toLocaleDateString('fr-FR') : '—'}</p>
                        </div>
                    </div>
                `;
            } catch (e) {
                document.getElementById('content').innerHTML = `<p class="text-red-400">Erreur de chargement</p>`;
            }
        }
        load();
    </script>
</body>
</html>
