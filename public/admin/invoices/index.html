<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factures - TruckAll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-900 text-gray-100">
    <div id="sidebar-container"></div>

    <div class="p-4 sm:ml-64">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-white">Factures</h1>
            <p class="text-sm text-gray-400">Liste des factures générées</p>
        </div>

        <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
            <table class="w-full text-sm text-left text-gray-300">
                <thead class="text-xs text-gray-400 uppercase bg-gray-700/50">
                    <tr>
                        <th class="px-6 py-3">Numéro</th>
                        <th class="px-6 py-3">Annonceur</th>
                        <th class="px-6 py-3">Montant</th>
                        <th class="px-6 py-3">Statut</th>
                        <th class="px-6 py-3">Date</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="5" class="px-6 py-8 text-center text-gray-400">Chargement...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { requireAuth } from '../assets/js/auth.js';
        import api from '../assets/js/api.js';

        requireAuth();
        fetch('/admin/components/sidebar.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar-container').innerHTML = html;
        });

        async function load() {
            try {
                const res = await api.get('/admin/invoices').catch(() => ({ data: { data: [] } }));
                const items = res.data.data || res.data || [];
                const tbody = document.getElementById('table-body');

                if (!items.length) {
                    tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-gray-400">Aucune facture</td></tr>`;
                    return;
                }

                tbody.innerHTML = items.map(inv => `
                    <tr class="border-b border-gray-700 hover:bg-gray-700/40">
                        <td class="px-6 py-4 font-medium text-white">${inv.number || inv.id}</td>
                        <td class="px-6 py-4">${inv.advertiser?.name || inv.advertiser_id || '—'}</td>
                        <td class="px-6 py-4">${inv.amount ? inv.amount + ' $' : '—'}</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-0.5 rounded-full text-xs bg-gray-600">${inv.status || '—'}</span>
                        </td>
                        <td class="px-6 py-4">${inv.created_at ? new Date(inv.created_at).toLocaleDateString('fr-FR') : '—'}</td>
                    </tr>
                `).join('');
            } catch (e) {
                document.getElementById('table-body').innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-red-400">Erreur</td></tr>`;
            }
        }
        load();
    </script>
</body>
</html>
