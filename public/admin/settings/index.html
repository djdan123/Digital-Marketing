<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramètres - TruckAll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-900 text-gray-100">
    <div id="sidebar-container"></div>

    <div class="p-4 sm:ml-64">
        <div class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-white">Paramètres</h1>
                <p class="text-sm text-gray-400">Configuration générale de la plateforme</p>
            </div>
            <button id="refresh-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-lg">Actualiser</button>
        </div>

        <div id="alert" class="hidden mb-6 p-4 rounded-lg text-sm"></div>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
            <div class="xl:col-span-2 bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-700">
                    <h2 class="text-lg font-semibold text-white">Liste des paramètres</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-gray-300">
                        <thead class="bg-gray-700/60 text-xs uppercase text-gray-400">
                            <tr>
                                <th class="px-6 py-3">Clé</th>
                                <th class="px-6 py-3">Groupe</th>
                                <th class="px-6 py-3">Valeur</th>
                                <th class="px-6 py-3">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="settings-table-body">
                            <tr>
                                <td colspan="4" class="px-6 py-8 text-center text-gray-400">Chargement des paramètres...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="bg-gray-800 rounded-lg border border-gray-700 p-6">
                <h2 class="text-lg font-semibold text-white mb-4" id="form-title">Ajouter un paramètre</h2>
                <form id="settings-form" class="space-y-4">
                    <input type="hidden" id="setting-id" value="">
                    <div>
                        <label class="block mb-2 text-sm font-medium text-white">Clé</label>
                        <input type="text" id="key" required class="bg-gray-700 border border-gray-600 text-white rounded-lg block w-full p-2.5">
                    </div>
                    <div>
                        <label class="block mb-2 text-sm font-medium text-white">Groupe</label>
                        <input type="text" id="group" class="bg-gray-700 border border-gray-600 text-white rounded-lg block w-full p-2.5" placeholder="app, mail, payment...">
                    </div>
                    <div>
                        <label class="block mb-2 text-sm font-medium text-white">Valeur</label>
                        <input type="text" id="value" class="bg-gray-700 border border-gray-600 text-white rounded-lg block w-full p-2.5">
                    </div>
                    <div>
                        <label class="block mb-2 text-sm font-medium text-white">Détails</label>
                        <textarea id="details" rows="3" class="bg-gray-700 border border-gray-600 text-white rounded-lg block w-full p-2.5"></textarea>
                    </div>
                    <div class="flex gap-3 pt-2">
                        <button type="submit" id="submit-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg">Enregistrer</button>
                        <button type="button" id="cancel-btn" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg hidden">Annuler</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { requireAuth } from '../assets/js/auth.js';
        import api from '../assets/js/api.js';

        requireAuth();
        fetch('/admin/components/sidebar.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar-container').innerHTML = html;
        });

        const alertBox = document.getElementById('alert');
        const tableBody = document.getElementById('settings-table-body');
        const form = document.getElementById('settings-form');
        const submitBtn = document.getElementById('submit-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const formTitle = document.getElementById('form-title');
        const settingIdInput = document.getElementById('setting-id');

        function showAlert(message, type = 'error') {
            alertBox.classList.remove('hidden');
            alertBox.className = `mb-6 p-4 rounded-lg text-sm ${type === 'success' ? 'bg-green-800 text-green-100 border border-green-700' : 'bg-red-800 text-red-100 border border-red-700'}`;
            alertBox.textContent = message;
        }

        function resetForm() {
            form.reset();
            settingIdInput.value = '';
            formTitle.textContent = 'Ajouter un paramètre';
            submitBtn.textContent = 'Enregistrer';
            cancelBtn.classList.add('hidden');
        }

        async function loadSettings() {
            try {
                const response = await api.get('/admin/settings', { params: { per_page: 100 } });
                const items = response.data?.data?.data || response.data?.data || [];

                if (!items.length) {
                    tableBody.innerHTML = '<tr><td colspan="4" class="px-6 py-8 text-center text-gray-400">Aucun paramètre trouvé.</td></tr>';
                    return;
                }

                tableBody.innerHTML = items.map(item => `
                    <tr class="border-b border-gray-700 hover:bg-gray-700/40">
                        <td class="px-6 py-4 font-medium text-white">${item.key || '—'}</td>
                        <td class="px-6 py-4">${item.group || '—'}</td>
                        <td class="px-6 py-4 text-gray-300">${item.value || '—'}</td>
                        <td class="px-6 py-4 space-x-2">
                            <button type="button" data-edit="${item.id}" class="text-blue-400 hover:text-blue-300 text-sm">Modifier</button>
                            <button type="button" data-delete="${item.id}" class="text-red-400 hover:text-red-300 text-sm">Supprimer</button>
                        </td>
                    </tr>
                `).join('');

                tableBody.querySelectorAll('[data-edit]').forEach(btn => {
                    btn.addEventListener('click', () => editSetting(btn.dataset.edit));
                });

                tableBody.querySelectorAll('[data-delete]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        if (!confirm('Supprimer ce paramètre ?')) return;
                        try {
                            await api.delete(`/admin/settings/${btn.dataset.delete}`);
                            showAlert('Paramètre supprimé avec succès', 'success');
                            loadSettings();
                        } catch (error) {
                            showAlert('Erreur lors de la suppression.');
                        }
                    });
                });
            } catch (error) {
                tableBody.innerHTML = '<tr><td colspan="4" class="px-6 py-8 text-center text-red-400">Impossible de charger les paramètres.</td></tr>';
            }
        }

        async function editSetting(id) {
            try {
                const response = await api.get(`/admin/settings/${id}`);
                const item = response.data?.data || response.data;
                document.getElementById('setting-id').value = item.id || '';
                document.getElementById('key').value = item.key || '';
                document.getElementById('group').value = item.group || '';
                document.getElementById('value').value = item.value || '';
                document.getElementById('details').value = item.details || '';
                formTitle.textContent = 'Modifier un paramètre';
                submitBtn.textContent = 'Mettre à jour';
                cancelBtn.classList.remove('hidden');
            } catch (error) {
                showAlert('Impossible de charger ce paramètre.');
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                key: document.getElementById('key').value.trim(),
                group: document.getElementById('group').value.trim() || null,
                value: document.getElementById('value').value.trim() || null,
                details: document.getElementById('details').value.trim() || null,
            };

            if (!payload.key) {
                showAlert('La clé du paramètre est obligatoire.');
                return;
            }

            try {
                if (settingIdInput.value) {
                    await api.put(`/admin/settings/${settingIdInput.value}`, payload);
                    showAlert('Paramètre mis à jour avec succès', 'success');
                } else {
                    await api.post('/admin/settings', payload);
                    showAlert('Paramètre créé avec succès', 'success');
                }
                resetForm();
                loadSettings();
            } catch (error) {
                const message = error.response?.data?.message || Object.values(error.response?.data?.errors || {}).flat().join(' ') || 'Erreur lors de l’enregistrement.';
                showAlert(message);
            }
        });

        cancelBtn.addEventListener('click', resetForm);
        document.getElementById('refresh-btn').addEventListener('click', loadSettings);

        loadSettings();
    </script>
</body>
</html>
