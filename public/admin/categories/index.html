<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catégories - TruckAll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-900 text-gray-100">
    <div id="sidebar-container"></div>

    <div class="p-4 sm:ml-64">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-white">Catégories</h1>
                <p class="text-sm text-gray-400">Commerce, Sport, Politique, Musique…</p>
            </div>
            <a href="/admin/categories/create.html" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-lg">+ Nouvelle catégorie</a>
        </div>

        <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
            <table class="w-full text-sm text-left text-gray-300">
                <thead class="text-xs text-gray-400 uppercase bg-gray-700/50">
                    <tr>
                        <th class="px-6 py-3">Nom</th>
                        <th class="px-6 py-3">Slug</th>
                        <th class="px-6 py-3">Description</th>
                        <th class="px-6 py-3 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="4" class="px-6 py-8 text-center text-gray-400">Chargement...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { requireAuth } from '../assets/js/auth.js';
        import api from '../assets/js/api.js';

        requireAuth();
        fetch('/admin/components/sidebar.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar-container').innerHTML = html;
        });

        async function load() {
            try {
                const res = await api.get('/admin/categories')
                    .catch(() => api.get('/shared/categories'));
                const items = res.data?.data || res.data || [];
                const tbody = document.getElementById('table-body');

                if (!Array.isArray(items) || !items.length) {
                    tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-gray-400">Aucune catégorie</td></tr>`;
                    return;
                }

                tbody.innerHTML = items.map(c => `
                    <tr class="border-b border-gray-700 hover:bg-gray-700/40">
                        <td class="px-6 py-4 font-medium text-white">${c.name || '—'}</td>
                        <td class="px-6 py-4 text-gray-400">${c.slug || '—'}</td>
                        <td class="px-6 py-4 text-gray-300">${c.description || '—'}</td>
                        <td class="px-6 py-4 text-right space-x-2">
                            <a href="/admin/categories/edit.html?id=${c.id}" class="text-blue-400 hover:text-blue-300">Modifier</a>
                            <button onclick="deleteCategory(${c.id})" class="text-red-400 hover:text-red-300">Supprimer</button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                document.getElementById('table-body').innerHTML =
                    `<tr><td colspan="4" class="px-6 py-8 text-center text-red-400">Erreur de chargement</td></tr>`;
            }
        }

        window.deleteCategory = async function(id) {
            if (!confirm('Supprimer cette catégorie ?')) return;
            try {
                await api.delete(`/admin/categories/${id}`);
                load();
            } catch {
                alert('Suppression impossible');
            }
        };

        load();
    </script>
</body>
</html>
