<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier planification - TruckAll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <link href="/admin/assets/css/app.css" rel="stylesheet" />
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-900 text-gray-100">
    <div id="sidebar-container"></div>

    <div class="p-4 sm:ml-64">
        <div class="mb-6">
            <a href="/admin/schedules/index.html" class="text-sm text-blue-400 hover:underline">← Retour aux planifications</a>
            <h1 class="text-2xl font-bold text-white mt-2">Modifier la planification</h1>
        </div>

        <div id="alert" class="hidden mb-6 p-4 rounded-lg text-sm"></div>

        <div class="bg-gray-800 rounded-lg border border-gray-700 p-6 max-w-3xl">
            <form id="schedule-form" class="space-y-6">
                <div>
                    <label class="block mb-2 text-sm font-medium text-white">Date et heure</label>
                    <input type="datetime-local" id="scheduled_at" name="scheduled_at" required
                           class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5">
                </div>
                <div>
                    <label class="block mb-2 text-sm font-medium text-white">Statut</label>
                    <select id="status" name="status" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5">
                        <option value="pending">En attente</option>
                        <option value="scheduled">Planifiée</option>
                        <option value="completed">Terminée</option>
                        <option value="cancelled">Annulée</option>
                    </select>
                </div>
                <div class="flex gap-3 pt-4 border-t border-gray-700">
                    <button type="submit" id="submit-btn" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-lg">Enregistrer</button>
                    <a href="/admin/schedules/index.html" class="px-5 py-2.5 bg-gray-700 hover:bg-gray-600 text-white text-sm rounded-lg">Annuler</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import api from '../assets/js/api.js';
        import { initAdminPage, showAlert } from '../assets/js/layout.js';

        initAdminPage();

        const id = new URLSearchParams(window.location.search).get('id');
        const submitBtn = document.getElementById('submit-btn');

        function toLocalInput(value) {
            if (!value) return '';
            const d = new Date(value);
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        async function load() {
            if (!id) {
                showAlert('alert', 'Identifiant manquant.');
                return;
            }
            try {
                const { data } = await api.get(`/media-manager/schedules/${id}`);
                const s = data.data || data;
                document.getElementById('scheduled_at').value = toLocalInput(s.scheduled_at);
                if (s.status) document.getElementById('status').value = s.status;
            } catch {
                showAlert('alert', 'Impossible de charger la planification.');
            }
        }

        document.getElementById('schedule-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            try {
                await api.put(`/media-manager/schedules/${id}`, {
                    scheduled_at: document.getElementById('scheduled_at').value,
                    status: document.getElementById('status').value,
                });
                showAlert('alert', 'Planification mise à jour.', 'success');
                setTimeout(() => { window.location.href = '/admin/schedules/index.html'; }, 1000);
            } catch (error) {
                const msg = error.response?.data?.message || 'Erreur lors de la mise à jour.';
                showAlert('alert', msg);
                submitBtn.disabled = false;
            }
        });

        load();
    </script>
</body>
</html>
