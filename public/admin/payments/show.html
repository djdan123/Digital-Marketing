<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail paiement - TruckAll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-900 text-gray-100">
    <div id="sidebar-container"></div>

    <div class="p-4 sm:ml-64">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-white">Détail du paiement</h1>
        </div>

        <div id="content" class="bg-gray-800 rounded-lg border border-gray-700 p-6 max-w-2xl">
            <p class="text-gray-400">Chargement...</p>
        </div>

        <div class="mt-4">
            <a href="/admin/payments/index.html" class="text-blue-400 hover:text-blue-300 text-sm">← Retour aux paiements</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { requireAuth } from '../assets/js/auth.js';
        import api from '../assets/js/api.js';

        requireAuth();
        fetch('/admin/components/sidebar.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar-container').innerHTML = html;
        });

        const id = new URLSearchParams(window.location.search).get('id');
        if (!id) window.location.href = '/admin/payments/index.html';

        async function load() {
            try {
                const res = await api.get(`/admin/payments/${id}`).catch(() => api.get(`/advertiser/payments/${id}`));
                const p = res.data.data || res.data;

                document.getElementById('content').innerHTML = `
                    <div class="space-y-4">
                        <div>
                            <p class="text-sm text-gray-400">Référence</p>
                            <p class="text-white font-medium">${p.reference || p.id}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-400">Montant</p>
                            <p class="text-white font-medium">${p.amount ? p.amount + ' ' + (p.currency || '$') : '—'}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-400">Méthode</p>
                            <p class="text-white font-medium">${p.payment_method || '—'}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-400">Statut</p>
                            <p class="text-white font-medium">${p.status || '—'}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-400">Date</p>
                            <p class="text-white font-medium">${p.created_at ? new Date(p.created_at).toLocaleString('fr-FR') : '—'}</p>
                        </div>
                    </div>
                `;
            } catch (e) {
                document.getElementById('content').innerHTML = `<p class="text-red-400">Impossible de charger le paiement</p>`;
            }
        }
        load();
    </script>
</body>
</html>
