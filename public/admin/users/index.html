<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilisateurs - TruckAll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-900 text-gray-100">
    <div id="sidebar-container"></div>

    <div class="p-4 sm:ml-64">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-white">Utilisateurs</h1>
                <p class="text-sm text-gray-400">Gestion des comptes utilisateurs</p>
            </div>
        </div>

        <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
            <table class="w-full text-sm text-left text-gray-300">
                <thead class="text-xs text-gray-400 uppercase bg-gray-700/50">
                    <tr>
                        <th class="px-6 py-3">Nom</th>
                        <th class="px-6 py-3">Email</th>
                        <th class="px-6 py-3">Rôle</th>
                        <th class="px-6 py-3 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="4" class="px-6 py-8 text-center text-gray-400">Chargement...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { requireAuth } from '../assets/js/auth.js';
        import api from '../assets/js/api.js';

        requireAuth();
        fetch('/admin/components/sidebar.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar-container').innerHTML = html;
        });

        async function load() {
            try {
                const res = await api.get('/admin/users');
                const items = res.data?.data || res.data || [];
                const tbody = document.getElementById('table-body');

                if (!Array.isArray(items) || !items.length) {
                    tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-gray-400">Aucun utilisateur disponible.</td></tr>`;
                    return;
                }

                tbody.innerHTML = items.map(u => `
                    <tr class="border-b border-gray-700 hover:bg-gray-700/40">
                        <td class="px-6 py-4 font-medium text-white">${u.name || '—'}</td>
                        <td class="px-6 py-4">${u.email || '—'}</td>
                        <td class="px-6 py-4">${u.role || '—'}</td>
                        <td class="px-6 py-4 text-right">
                            <a href="/admin/users/edit.html?id=${u.id}" class="text-blue-400 hover:text-blue-300">Modifier</a>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                document.getElementById('table-body').innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-red-400">${e.response?.status === 403 ? 'Vous n’êtes pas autorisé à consulter cette ressource.' : 'Impossible de charger les utilisateurs.'}</td></tr>`;
            }
        }
        load();
    </script>
</body>
</html>
