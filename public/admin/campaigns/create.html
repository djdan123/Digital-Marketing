<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvelle campagne - TruckAll</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {"50":"#eff6ff","100":"#dbeafe","200":"#bfdbfe","300":"#93c5fd","400":"#60a5fa","500":"#3b82f6","600":"#2563eb","700":"#1d4ed8","800":"#1e40af","900":"#1e3a8a"}
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-gray-100">

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Contenu principal -->
    <div class="p-4 sm:ml-64">

        <!-- Header -->
        <div class="mb-6">
            <nav class="flex mb-3" aria-label="Breadcrumb">
                <ol class="inline-flex items-center space-x-1 md:space-x-2">
                    <li class="inline-flex items-center">
                        <a href="/admin/index.html" class="text-sm text-gray-400 hover:text-white">Tableau de bord</a>
                    </li>
                    <li>
                        <div class="flex items-center">
                            <svg class="w-3 h-3 text-gray-500 mx-1" fill="none" viewBox="0 0 6 10">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 9 4-4-4-4"/>
                            </svg>
                            <a href="/admin/campaigns/index.html" class="text-sm text-gray-400 hover:text-white ml-1">Campagnes</a>
                        </div>
                    </li>
                    <li aria-current="page">
                        <div class="flex items-center">
                            <svg class="w-3 h-3 text-gray-500 mx-1" fill="none" viewBox="0 0 6 10">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 9 4-4-4-4"/>
                            </svg>
                            <span class="text-sm text-gray-300 ml-1">Nouvelle campagne</span>
                        </div>
                    </li>
                </ol>
            </nav>

            <h1 class="text-2xl font-bold text-white">Créer une campagne</h1>
            <p class="text-sm text-gray-400 mt-1">Remplissez les informations pour créer une nouvelle campagne publicitaire</p>
        </div>

        <!-- Message d'erreur / succès -->
        <div id="alert" class="hidden mb-6 p-4 rounded-lg text-sm"></div>

        <!-- Formulaire -->
        <div class="bg-gray-800 rounded-lg border border-gray-700 p-6 max-w-3xl">
            <form id="create-campaign-form" class="space-y-6">

                <!-- Nom -->
                <div>
                    <label for="name" class="block mb-2 text-sm font-medium text-white">
                        Nom de la campagne <span class="text-red-400">*</span>
                    </label>
                    <input type="text" id="name" name="name" required
                           class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                           placeholder="Ex: Campagne Été 2026">
                    <p id="name-error" class="mt-1 text-xs text-red-400 hidden"></p>
                </div>

                <!-- Annonceur -->
                <div>
                    <label for="advertiser_id" class="block mb-2 text-sm font-medium text-white">
                        Annonceur <span class="text-red-400">*</span>
                    </label>
                    <select id="advertiser_id" name="advertiser_id" required
                            class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
                        <option value="">Chargement des annonceurs...</option>
                    </select>
                    <p id="advertiser-error" class="mt-1 text-xs text-red-400 hidden"></p>
                    <p class="mt-1 text-xs text-gray-400">Sélectionnez l’annonceur associé à cette campagne.</p>
                </div>

                <!-- Objectif -->
                <div>
                    <label for="objective" class="block mb-2 text-sm font-medium text-white">
                        Objectif
                    </label>
                    <textarea id="objective" name="objective" rows="3"
                              class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                              placeholder="Décrivez l’objectif de la campagne..."></textarea>
                </div>

                <!-- Budget + Statut -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="budget" class="block mb-2 text-sm font-medium text-white">
                            Budget ($) <span class="text-red-400">*</span>
                        </label>
                        <input type="number" id="budget" name="budget" required min="0" step="0.01"
                               class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                               placeholder="Ex: 5000">
                        <p id="budget-error" class="mt-1 text-xs text-red-400 hidden"></p>
                    </div>

                    <div>
                        <label for="status" class="block mb-2 text-sm font-medium text-white">
                            Statut <span class="text-red-400">*</span>
                        </label>
                        <select id="status" name="status" required
                                class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
                            <option value="draft">Brouillon</option>
                            <option value="pending">En attente</option>
                            <option value="approved">Approuvée</option>
                            <option value="active">Active</option>
                            <option value="completed">Terminée</option>
                            <option value="cancelled">Annulée</option>
                        </select>
                    </div>
                </div>

                <!-- Dates -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="starts_at" class="block mb-2 text-sm font-medium text-white">
                            Date de début
                        </label>
                        <input type="date" id="starts_at" name="starts_at"
                               class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
                    </div>

                    <div>
                        <label for="ends_at" class="block mb-2 text-sm font-medium text-white">
                            Date de fin
                        </label>
                        <input type="date" id="ends_at" name="ends_at"
                               class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
                    </div>
                </div>

                <!-- Boutons -->
                <div class="flex items-center gap-3 pt-4 border-t border-gray-700">
                    <button type="submit" id="submit-btn"
                            class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg focus:ring-4 focus:ring-blue-800 transition disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center min-w-40">
                        <span id="submit-btn-text">Créer la campagne</span>
                        <svg id="submit-btn-spinner" class="hidden ml-2 h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                        </svg>
                    </button>

                    <a href="/admin/campaigns/index.html"
                       class="px-5 py-2.5 bg-gray-700 hover:bg-gray-600 text-white text-sm font-medium rounded-lg transition">
                        Annuler
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>

    <script type="module">
        import { requireAuth } from '../assets/js/auth.js';
        import api from '../assets/js/api.js';

        requireAuth();

        // Charger la sidebar
        fetch('/admin/components/sidebar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;
            });

        const form = document.getElementById('create-campaign-form');
        const alertBox = document.getElementById('alert');
        const submitBtn = document.getElementById('submit-btn');
        const submitBtnText = document.getElementById('submit-btn-text');
        const submitBtnSpinner = document.getElementById('submit-btn-spinner');
        const advertiserSelect = document.getElementById('advertiser_id');

        function showAlert(message, type = 'error') {
            alertBox.classList.remove('hidden');
            if (type === 'success') {
                alertBox.className = 'mb-6 p-4 rounded-lg text-sm bg-green-800 text-green-100 border border-green-700';
            } else {
                alertBox.className = 'mb-6 p-4 rounded-lg text-sm bg-red-800 text-red-100 border border-red-700';
            }
            alertBox.textContent = message;
        }

        function setFieldError(fieldId, message) {
            const field = document.getElementById(fieldId);
            const errorEl = document.getElementById(`${fieldId}-error`);
            if (field) field.classList.toggle('border-red-500', Boolean(message));
            if (errorEl) {
                errorEl.textContent = message || '';
                errorEl.classList.toggle('hidden', !message);
            }
        }

        function clearErrors() {
            ['name', 'advertiser_id', 'budget'].forEach((fieldId) => setFieldError(fieldId, ''));
        }

        function setSubmitting(isSubmitting) {
            submitBtn.disabled = isSubmitting;
            submitBtnText.textContent = isSubmitting ? 'Création en cours...' : 'Créer la campagne';
            submitBtnSpinner.classList.toggle('hidden', !isSubmitting);
        }

        async function loadAdvertisers() {
            try {
                const response = await api.get('/admin/advertisers');
                const advertisers = response.data?.data || [];

                advertiserSelect.innerHTML = '<option value="">Sélectionnez un annonceur</option>';

                if (!advertisers.length) {
                    advertiserSelect.innerHTML += '<option value="" disabled>Aucun annonceur disponible</option>';
                    showAlert('Aucun annonceur n’est encore disponible. Créez d’abord un profil annonceur pour pouvoir créer une campagne.', 'error');
                    return;
                }

                advertisers.forEach((advertiser) => {
                    const option = document.createElement('option');
                    option.value = advertiser.id;
                    option.textContent = `${advertiser.name} (${advertiser.company || 'Sans société'})`;
                    advertiserSelect.appendChild(option);
                });
            } catch (error) {
                advertiserSelect.innerHTML = '<option value="" disabled>Impossible de charger les annonceurs</option>';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearErrors();

            const data = {
                name: document.getElementById('name').value.trim(),
                advertiser_id: parseInt(document.getElementById('advertiser_id').value, 10),
                objective: document.getElementById('objective').value.trim() || null,
                budget: document.getElementById('budget').value,
                status: document.getElementById('status').value,
                starts_at: document.getElementById('starts_at').value || null,
                ends_at: document.getElementById('ends_at').value || null,
            };

            let hasError = false;
            if (!data.name.trim()) {
                setFieldError('name', 'Le nom est obligatoire.');
                hasError = true;
            }
            if (!data.advertiser_id) {
                setFieldError('advertiser_id', 'Veuillez sélectionner un annonceur.');
                hasError = true;
            }
            if (!data.budget || Number(data.budget) < 0) {
                setFieldError('budget', 'Le budget doit être un nombre positif.');
                hasError = true;
            }
            if (hasError) {
                showAlert('Veuillez corriger les champs indiqués.');
                return;
            }

            if (data.starts_at && data.ends_at && data.ends_at < data.starts_at) {
                setFieldError('starts_at', 'La date de fin doit être postérieure à la date de début.');
                showAlert('La date de fin doit être postérieure à la date de début.');
                return;
            }

            setSubmitting(true);
            alertBox.classList.add('hidden');

            try {
                await api.post('/admin/campaigns', data);

                showAlert('Campagne créée avec succès ! Redirection...', 'success');

                setTimeout(() => {
                    window.location.href = '/admin/campaigns/index.html';
                }, 1000);

            } catch (error) {
                let message = 'Une erreur est survenue lors de la création.';

                if (error.response?.status === 422) {
                    const errors = error.response.data.errors;
                    message = Object.values(errors || {}).flat().join(' ');
                } else if (error.response?.data?.message) {
                    message = error.response.data.message;
                }

                showAlert(message);
                setSubmitting(false);
            }
        });

        loadAdvertisers();
    </script>
</body>
</html>
