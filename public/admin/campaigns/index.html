<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campagnes - TruckAll</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {"50":"#eff6ff","100":"#dbeafe","200":"#bfdbfe","300":"#93c5fd","400":"#60a5fa","500":"#3b82f6","600":"#2563eb","700":"#1d4ed8","800":"#1e40af","900":"#1e3a8a"}
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-gray-100">

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Contenu principal -->
    <div class="p-4 sm:ml-64">

        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-white">Campagnes</h1>
                <p class="text-sm text-gray-400">Gérez toutes les campagnes publicitaires</p>
            </div>

            <div class="flex items-center gap-3">
                <a href="/admin/campaigns/create.html" 
                   class="inline-flex items-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    Nouvelle campagne
                </a>
            </div>
        </div>

        <!-- Filtres -->
        <div class="bg-gray-800 rounded-lg border border-gray-700 p-4 mb-6">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-1">
                    <input type="text" id="search-input" placeholder="Rechercher une campagne..."
                           class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
                </div>
                <div>
                    <select id="status-filter" 
                            class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
                        <option value="">Tous les statuts</option>
                        <option value="draft">Brouillon</option>
                        <option value="pending">En attente</option>
                        <option value="approved">Approuvée</option>
                        <option value="active">Active</option>
                        <option value="completed">Terminée</option>
                        <option value="cancelled">Annulée</option>
                    </select>
                </div>
                <button id="filter-btn" class="px-4 py-2.5 bg-gray-700 hover:bg-gray-600 text-white text-sm rounded-lg">
                    Filtrer
                </button>
            </div>
        </div>

        <!-- Tableau -->
        <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-gray-300">
                    <thead class="text-xs text-gray-400 uppercase bg-gray-700/50">
                        <tr>
                            <th scope="col" class="px-6 py-3">Nom</th>
                            <th scope="col" class="px-6 py-3">Annonceur</th>
                            <th scope="col" class="px-6 py-3">Budget</th>
                            <th scope="col" class="px-6 py-3">Statut</th>
                            <th scope="col" class="px-6 py-3">Période</th>
                            <th scope="col" class="px-6 py-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="campaigns-table-body">
                        <tr>
                            <td colspan="6" class="px-6 py-8 text-center text-gray-400">
                                Chargement des campagnes...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="flex items-center justify-between px-6 py-4 border-t border-gray-700">
                <span class="text-sm text-gray-400" id="pagination-info">—</span>
                <div class="flex gap-2" id="pagination-buttons"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>

    <script type="module">
        import { requireAuth, logout } from '../assets/js/auth.js';
        import api from '../assets/js/api.js';

        requireAuth();

        // Charger la sidebar
        fetch('/admin/components/sidebar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;
            });

        // Fonction pour afficher le statut avec badge coloré
        function getStatusBadge(status) {
            const styles = {
                draft: 'bg-gray-600 text-gray-100',
                pending: 'bg-yellow-600 text-yellow-100',
                approved: 'bg-blue-600 text-blue-100',
                active: 'bg-green-600 text-green-100',
                completed: 'bg-purple-600 text-purple-100',
                cancelled: 'bg-red-600 text-red-100'
            };

            const labels = {
                draft: 'Brouillon',
                pending: 'En attente',
                approved: 'Approuvée',
                active: 'Active',
                completed: 'Terminée',
                cancelled: 'Annulée'
            };

            const style = styles[status] || 'bg-gray-600 text-gray-100';
            const label = labels[status] || status;

            return `<span class="px-2.5 py-0.5 rounded-full text-xs font-medium ${style}">${label}</span>`;
        }

        // Charger les campagnes
        async function loadCampaigns(page = 1) {
            const search = document.getElementById('search-input').value;
            const status = document.getElementById('status-filter').value;

            try {
                const params = { page, per_page: 15 };
                if (status) params.status = status;
                if (search) params.search = search;

                const response = await api.get('/admin/campaigns', { params });
                const campaigns = response.data?.data || response.data || [];
                const meta = response.data?.meta || {};

                const tbody = document.getElementById('campaigns-table-body');

                if (!Array.isArray(campaigns) || campaigns.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="6" class="px-6 py-8 text-center text-gray-400">
                                Aucune campagne trouvée pour cette recherche.
                            </td>
                        </tr>
                    `;
                    return;
                }

                tbody.innerHTML = campaigns.map(campaign => `
                    <tr class="border-b border-gray-700 hover:bg-gray-700/50">
                        <td class="px-6 py-4 font-medium text-white">
                            ${campaign.name || '—'}
                        </td>
                        <td class="px-6 py-4">
                            ${campaign.advertiser?.name || campaign.advertiser_id || '—'}
                        </td>
                        <td class="px-6 py-4">
                            ${campaign.budget ? new Intl.NumberFormat('fr-FR').format(campaign.budget) + ' $' : '—'}
                        </td>
                        <td class="px-6 py-4">
                            ${getStatusBadge(campaign.status)}
                        </td>
                        <td class="px-6 py-4 text-sm">
                            ${campaign.starts_at ? new Date(campaign.starts_at).toLocaleDateString('fr-FR') : '—'}
                            →
                            ${campaign.ends_at ? new Date(campaign.ends_at).toLocaleDateString('fr-FR') : '—'}
                        </td>
                        <td class="px-6 py-4 text-right space-x-2">
                            <a href="/admin/campaigns/edit.html?id=${campaign.id}" 
                               class="text-blue-400 hover:text-blue-300 text-sm">Modifier</a>
                            <button onclick="deleteCampaign(${campaign.id})" 
                                    class="text-red-400 hover:text-red-300 text-sm">Supprimer</button>
                        </td>
                    </tr>
                `).join('');

                // Info pagination
                document.getElementById('pagination-info').textContent = 
                    `Page ${meta.current_page || 1} sur ${meta.last_page || 1}`;

            } catch (error) {
                console.error(error);
                document.getElementById('campaigns-table-body').innerHTML = `
                    <tr>
                        <td colspan="6" class="px-6 py-8 text-center text-red-400">
                            ${error.response?.status === 403 ? 'Vous n’êtes pas autorisé à consulter cette ressource.' : 'Impossible de charger les campagnes. Veuillez réessayer.'}
                        </td>
                    </tr>
                `;
            }
        }

        // Suppression
        window.deleteCampaign = async function(id) {
            if (!confirm('Voulez-vous vraiment supprimer cette campagne ?')) return;

            try {
                await api.delete(`/admin/campaigns/${id}`);
                loadCampaigns();
            } catch (error) {
                alert('Erreur lors de la suppression');
            }
        };

        // Filtres
        document.getElementById('filter-btn').addEventListener('click', () => loadCampaigns());
        document.getElementById('search-input').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') loadCampaigns();
        });

        // Charger au démarrage
        loadCampaigns();
    </script>
</body>
</html>
