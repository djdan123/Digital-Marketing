<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier campagne - TruckAll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-900 text-gray-100">
    <div id="sidebar-container"></div>

    <div class="p-4 sm:ml-64">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-white">Modifier la campagne</h1>
            <p class="text-sm text-gray-400">Mettez à jour les informations de la campagne</p>
        </div>

        <div id="alert" class="hidden mb-6 p-4 rounded-lg text-sm"></div>

        <div class="bg-gray-800 rounded-lg border border-gray-700 p-6 max-w-3xl">
            <form id="edit-form" class="space-y-6">
                <div>
                    <label class="block mb-2 text-sm font-medium text-white">Nom <span class="text-red-400">*</span></label>
                    <input type="text" id="name" required class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5">
                    <p id="name-error" class="mt-1 text-xs text-red-400 hidden"></p>
                </div>

                <div>
                    <label for="advertiser_id" class="block mb-2 text-sm font-medium text-white">Annonceur <span class="text-red-400">*</span></label>
                    <select id="advertiser_id" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5">
                        <option value="">Chargement des annonceurs...</option>
                    </select>
                    <p id="advertiser-error" class="mt-1 text-xs text-red-400 hidden"></p>
                </div>

                <div>
                    <label class="block mb-2 text-sm font-medium text-white">Objectif</label>
                    <textarea id="objective" rows="3" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block mb-2 text-sm font-medium text-white">Budget ($) <span class="text-red-400">*</span></label>
                        <input type="number" id="budget" required min="0" step="0.01" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5">
                    </div>
                    <div>
                        <label class="block mb-2 text-sm font-medium text-white">Statut</label>
                        <select id="status" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5">
                            <option value="draft">Brouillon</option>
                            <option value="pending">En attente</option>
                            <option value="approved">Approuvée</option>
                            <option value="active">Active</option>
                            <option value="completed">Terminée</option>
                            <option value="cancelled">Annulée</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block mb-2 text-sm font-medium text-white">Date de début</label>
                        <input type="date" id="starts_at" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5">
                    </div>
                    <div>
                        <label class="block mb-2 text-sm font-medium text-white">Date de fin</label>
                        <input type="date" id="ends_at" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5">
                    </div>
                </div>

                <div class="flex gap-3 pt-4 border-t border-gray-700">
                    <button type="submit" id="submit-btn" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center min-w-40">
                        <span id="submit-btn-text">Enregistrer</span>
                        <svg id="submit-btn-spinner" class="hidden ml-2 h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                        </svg>
                    </button>
                    <a href="/admin/campaigns/index.html" class="px-5 py-2.5 bg-gray-700 hover:bg-gray-600 text-white text-sm font-medium rounded-lg">Annuler</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { requireAuth } from '../assets/js/auth.js';
        import api from '../assets/js/api.js';

        requireAuth();

        fetch('/admin/components/sidebar.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar-container').innerHTML = html;
        });

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        if (!id) {
            window.location.href = '/admin/campaigns/index.html';
        }

        const alertBox = document.getElementById('alert');
        const submitBtn = document.getElementById('submit-btn');
        const submitBtnText = document.getElementById('submit-btn-text');
        const submitBtnSpinner = document.getElementById('submit-btn-spinner');
        const advertiserSelect = document.getElementById('advertiser_id');

        function showAlert(msg, type = 'error') {
            alertBox.classList.remove('hidden');
            alertBox.className = `mb-6 p-4 rounded-lg text-sm ${type === 'success' ? 'bg-green-800 text-green-100' : 'bg-red-800 text-red-100'}`;
            alertBox.textContent = msg;
        }

        function setFieldError(fieldId, message) {
            const field = document.getElementById(fieldId);
            const errorEl = document.getElementById(`${fieldId}-error`);
            if (field) field.classList.toggle('border-red-500', Boolean(message));
            if (errorEl) {
                errorEl.textContent = message || '';
                errorEl.classList.toggle('hidden', !message);
            }
        }

        function clearErrors() {
            ['name', 'advertiser_id'].forEach((fieldId) => setFieldError(fieldId, ''));
        }

        function setSubmitting(isSubmitting) {
            submitBtn.disabled = isSubmitting;
            submitBtnText.textContent = isSubmitting ? 'Enregistrement...' : 'Enregistrer';
            submitBtnSpinner.classList.toggle('hidden', !isSubmitting);
        }

        async function loadAdvertisers() {
            try {
                const response = await api.get('/admin/advertisers').catch(() => api.get('/api/admin/advertisers'));
                const advertisers = response.data?.data || [];
                advertiserSelect.innerHTML = '<option value="">Sélectionnez un annonceur</option>';

                if (!advertisers.length) {
                    advertiserSelect.innerHTML += '<option value="" disabled>Aucun annonceur disponible</option>';
                    return;
                }

                advertisers.forEach((advertiser) => {
                    const option = document.createElement('option');
                    option.value = advertiser.id;
                    option.textContent = `${advertiser.name} (${advertiser.company || 'Sans société'})`;
                    advertiserSelect.appendChild(option);
                });
            } catch (error) {
                advertiserSelect.innerHTML = '<option value="" disabled>Impossible de charger les annonceurs</option>';
            }
        }

        // Charger la campagne
        async function loadCampaign() {
            try {
                const res = await api.get(`/admin/campaigns/${id}`);
                const c = res.data.data || res.data;

                document.getElementById('name').value = c.name || '';
                document.getElementById('advertiser_id').value = c.advertiser_id || '';
                document.getElementById('objective').value = c.objective || '';
                document.getElementById('budget').value = c.budget || '';
                document.getElementById('status').value = c.status || 'draft';
                document.getElementById('starts_at').value = c.starts_at ? c.starts_at.substring(0, 10) : '';
                document.getElementById('ends_at').value = c.ends_at ? c.ends_at.substring(0, 10) : '';
            } catch (e) {
                showAlert('Impossible de charger la campagne');
            }
        }

        document.getElementById('edit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearErrors();
            setSubmitting(true);

            const data = {
                name: document.getElementById('name').value.trim(),
                advertiser_id: parseInt(document.getElementById('advertiser_id').value, 10),
                objective: document.getElementById('objective').value.trim() || null,
                budget: document.getElementById('budget').value,
                status: document.getElementById('status').value,
                starts_at: document.getElementById('starts_at').value || null,
                ends_at: document.getElementById('ends_at').value || null,
            };

            if (!data.name.trim()) {
                setFieldError('name', 'Le nom est obligatoire.');
                showAlert('Veuillez corriger les champs indiqués.');
                setSubmitting(false);
                return;
            }
            if (!data.advertiser_id) {
                setFieldError('advertiser_id', 'Veuillez sélectionner un annonceur.');
                showAlert('Veuillez corriger les champs indiqués.');
                setSubmitting(false);
                return;
            }

            try {
                await api.put(`/admin/campaigns/${id}`, data);
                showAlert('Campagne mise à jour avec succès', 'success');
                setTimeout(() => window.location.href = '/admin/campaigns/index.html', 1000);
            } catch (error) {
                const msg = error.response?.data?.message || 'Erreur lors de la mise à jour';
                showAlert(msg);
                setSubmitting(false);
            }
        });

        loadAdvertisers().then(loadCampaign);
    </script>
</body>
</html>
