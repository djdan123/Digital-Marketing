<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau média - TruckAll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-900 text-gray-100">
    <div id="sidebar-container"></div>

    <div class="p-4 sm:ml-64">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-white">Nouveau média</h1>
            <p class="text-sm text-gray-400">Ajoutez une radio, TV, web ou panneau LED</p>
        </div>

        <div id="alert" class="hidden mb-6 p-4 rounded-lg text-sm"></div>

        <div class="bg-gray-800 rounded-lg border border-gray-700 p-6 max-w-3xl">
            <form id="create-form" class="space-y-6">
                <div>
                    <label class="block mb-2 text-sm font-medium text-white">Nom <span class="text-red-400">*</span></label>
                    <input type="text" id="name" required class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5">
                    <p id="name-error" class="mt-1 text-xs text-red-400 hidden"></p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block mb-2 text-sm font-medium text-white">Type <span class="text-red-400">*</span></label>
                        <select id="type" required class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5">
                            <option value="radio">Radio</option>
                            <option value="television">Télévision</option>
                            <option value="web">Web</option>
                            <option value="social">Réseaux sociaux</option>
                            <option value="led">Panneau LED</option>
                        </select>
                    </div>
                    <div>
                        <label class="block mb-2 text-sm font-medium text-white">Statut</label>
                        <select id="status" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5">
                            <option value="active">Actif</option>
                            <option value="inactive">Inactif</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block mb-2 text-sm font-medium text-white">Type de tarification</label>
                        <select id="pricing_type" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5">
                            <option value="fixed">Fixe</option>
                            <option value="cpm">CPM</option>
                            <option value="per_spot">Par spot</option>
                        </select>
                    </div>
                    <div>
                        <label class="block mb-2 text-sm font-medium text-white">Prix de base ($) <span class="text-red-400">*</span></label>
                        <input type="number" id="base_price" required min="0" step="0.01" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5">
                    </div>
                </div>

                <div>
                    <label class="block mb-2 text-sm font-medium text-white">Description</label>
                    <textarea id="description" rows="3" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block mb-2 text-sm font-medium text-white">Catégorie</label>
                        <select id="category_id" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5">
                            <option value="">Sélectionnez une catégorie</option>
                        </select>
                    </div>
                    <div>
                        <label class="block mb-2 text-sm font-medium text-white">Compagnie</label>
                        <select id="company_id" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5">
                            <option value="">Sélectionnez une compagnie</option>
                        </select>
                    </div>
                </div>

                <div class="flex gap-3 pt-4 border-t border-gray-700">
                    <button type="submit" id="submit-btn" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center min-w-30">
                        <span id="submit-btn-text">Créer</span>
                        <svg id="submit-btn-spinner" class="hidden ml-2 h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                        </svg>
                    </button>
                    <a href="/admin/media/index.html" class="px-5 py-2.5 bg-gray-700 hover:bg-gray-600 text-white text-sm font-medium rounded-lg">Annuler</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { requireAuth } from '../assets/js/auth.js';
        import api from '../assets/js/api.js';

        requireAuth();
        fetch('/admin/components/sidebar.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar-container').innerHTML = html;
        });

        const alertBox = document.getElementById('alert');
        const submitBtn = document.getElementById('submit-btn');
        const submitBtnText = document.getElementById('submit-btn-text');
        const submitBtnSpinner = document.getElementById('submit-btn-spinner');
        const categorySelect = document.getElementById('category_id');
        const companySelect = document.getElementById('company_id');

        function showAlert(msg, type = 'error') {
            alertBox.classList.remove('hidden');
            alertBox.className = `mb-6 p-4 rounded-lg text-sm ${type === 'success' ? 'bg-green-800 text-green-100' : 'bg-red-800 text-red-100'}`;
            alertBox.textContent = msg;
        }

        function setFieldError(fieldId, message) {
            const field = document.getElementById(fieldId);
            const errorEl = document.getElementById(`${fieldId}-error`);
            if (field) field.classList.toggle('border-red-500', Boolean(message));
            if (errorEl) {
                errorEl.textContent = message || '';
                errorEl.classList.toggle('hidden', !message);
            }
        }

        function setSubmitting(isSubmitting) {
            submitBtn.disabled = isSubmitting;
            submitBtnText.textContent = isSubmitting ? 'Création...' : 'Créer';
            submitBtnSpinner.classList.toggle('hidden', !isSubmitting);
        }

        async function loadRelations() {
            try {
                const [categoriesRes, companiesRes] = await Promise.all([
                    api.get('/admin/roles').catch(() => api.get('/api/admin/roles')),
                    api.get('/admin/settings').catch(() => api.get('/api/admin/settings'))
                ]);

                const categories = Array.isArray(categoriesRes.data?.data) ? categoriesRes.data.data : [];
                const companies = Array.isArray(companiesRes.data?.data) ? companiesRes.data.data : [];

                categorySelect.innerHTML = '<option value="">Sélectionnez une catégorie</option>';
                companySelect.innerHTML = '<option value="">Sélectionnez une compagnie</option>';

                categories.forEach((item) => {
                    const option = document.createElement('option');
                    option.value = item.id;
                    option.textContent = item.name || item.label || `Catégorie #${item.id}`;
                    categorySelect.appendChild(option);
                });

                companies.forEach((item) => {
                    const option = document.createElement('option');
                    option.value = item.id;
                    option.textContent = item.name || item.key || `Compagnie #${item.id}`;
                    companySelect.appendChild(option);
                });
            } catch (error) {
                categorySelect.innerHTML = '<option value="">Aucune catégorie disponible</option>';
                companySelect.innerHTML = '<option value="">Aucune compagnie disponible</option>';
            }
        }

        document.getElementById('create-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            setFieldError('name', '');
            setSubmitting(true);

            const data = {
                name: document.getElementById('name').value.trim(),
                type: document.getElementById('type').value,
                status: document.getElementById('status').value,
                pricing_type: document.getElementById('pricing_type').value,
                base_price: document.getElementById('base_price').value,
                description: document.getElementById('description').value.trim() || null,
                category_id: document.getElementById('category_id').value || null,
                company_id: document.getElementById('company_id').value || null,
            };

            if (!data.name) {
                setFieldError('name', 'Le nom du média est obligatoire.');
                showAlert('Veuillez corriger les champs indiqués.');
                setSubmitting(false);
                return;
            }

            try {
                await api.post('/admin/media', data);
                showAlert('Média créé avec succès', 'success');
                setTimeout(() => window.location.href = '/admin/media/index.html', 1000);
            } catch (error) {
                const msg = error.response?.data?.message || Object.values(error.response?.data?.errors || {}).flat().join(' ') || 'Erreur';
                showAlert(msg);
                setSubmitting(false);
            }
        });

        loadRelations();
    </script>
</body>
</html>
