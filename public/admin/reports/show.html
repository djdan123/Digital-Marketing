<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail rapport - TruckAll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-900 text-gray-100">
    <div id="sidebar-container"></div>

    <div class="p-4 sm:ml-64">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-white" id="report-title">Rapport</h1>
        </div>

        <div id="content" class="bg-gray-800 rounded-lg border border-gray-700 p-6">
            <p class="text-gray-400">Chargement...</p>
        </div>

        <div class="mt-4">
            <a href="/admin/reports/index.html" class="text-blue-400 hover:text-blue-300 text-sm">← Retour aux rapports</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { requireAuth } from '../assets/js/auth.js';
        import api from '../assets/js/api.js';

        requireAuth();
        fetch('/admin/components/sidebar.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar-container').innerHTML = html;
        });

        const id = new URLSearchParams(window.location.search).get('id');
        if (!id) window.location.href = '/admin/reports/index.html';

        async function load() {
            try {
                const res = await api.get(`/admin/reports/${id}`).catch(() => api.get(`/advertiser/reports/${id}`));
                const r = res.data.data || res.data;

                document.getElementById('report-title').textContent = r.title || 'Rapport';

                document.getElementById('content').innerHTML = `
                    <div class="space-y-4">
                        <div>
                            <p class="text-sm text-gray-400">Type</p>
                            <p class="text-white font-medium">${r.type || '—'}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-400">Description</p>
                            <p class="text-white mt-1">${r.description || '—'}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-400">Date</p>
                            <p class="text-white font-medium">${r.created_at ? new Date(r.created_at).toLocaleString('fr-FR') : '—'}</p>
                        </div>
                    </div>
                `;
            } catch (e) {
                document.getElementById('content').innerHTML = `<p class="text-red-400">Impossible de charger le rapport</p>`;
            }
        }
        load();
    </script>
</body>
</html>
