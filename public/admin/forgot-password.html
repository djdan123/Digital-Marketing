<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - TruckAll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <link href="/admin/assets/css/app.css" rel="stylesheet" />
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-900 text-gray-100">
    <div class="flex min-h-screen items-center justify-center p-4">
        <div class="w-full max-w-md p-6 bg-gray-800 rounded-lg border border-gray-700">
            <h1 class="text-xl font-bold text-center mb-6 text-white">Mot de passe oublié</h1>
            <div id="auth-message" class="hidden mb-4 p-3 text-sm rounded-lg border"></div>
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block mb-2 text-sm text-white">Email</label>
                    <input type="email" name="email" required class="bg-gray-700 border border-gray-600 text-white rounded-lg block w-full p-2.5">
                </div>
                <button type="submit" class="w-full text-white bg-blue-600 hover:bg-blue-700 rounded-lg py-2.5">Envoyer le lien</button>
            </form>
            <p class="mt-4 text-sm text-center text-gray-400">
                <a href="/admin/login.html" class="text-blue-400 hover:underline">Retour connexion</a>
            </p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import api from './assets/js/api.js';

        document.getElementById('auth-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('auth-message');
            const email = new FormData(e.target).get('email');
            try {
                await api.post('/forgot-password', { email });
                msg.className = 'mb-4 p-3 text-sm text-green-200 bg-green-900/50 border border-green-700 rounded-lg';
                msg.textContent = 'Si le compte existe, un email a été envoyé.';
            } catch {
                msg.className = 'mb-4 p-3 text-sm text-red-200 bg-red-900/50 border border-red-700 rounded-lg';
                msg.textContent = 'Impossible d\'envoyer la demande.';
            }
            msg.classList.remove('hidden');
        });
    </script>
</body>
</html>
