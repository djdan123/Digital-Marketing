<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier publicité - TruckAll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-900 text-gray-100">
    <div id="sidebar-container"></div>

    <div class="p-4 sm:ml-64">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-white">Modifier la publicité</h1>
        </div>

        <div id="alert" class="hidden mb-6 p-4 rounded-lg text-sm"></div>

        <div class="bg-gray-800 rounded-lg border border-gray-700 p-6 max-w-3xl">
            <form id="edit-form" class="space-y-6">
                <div>
                    <label class="block mb-2 text-sm font-medium text-white">Titre <span class="text-red-400">*</span></label>
                    <input type="text" id="title" required class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5">
                </div>

                <div>
                    <label class="block mb-2 text-sm font-medium text-white">Description</label>
                    <textarea id="description" rows="3" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block mb-2 text-sm font-medium text-white">Format</label>
                        <input type="text" id="format" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5">
                    </div>
                    <div>
                        <label class="block mb-2 text-sm font-medium text-white">Statut</label>
                        <select id="status" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5">
                            <option value="draft">Brouillon</option>
                            <option value="pending">En attente</option>
                            <option value="approved">Approuvée</option>
                            <option value="rejected">Refusée</option>
                            <option value="scheduled">Planifiée</option>
                            <option value="completed">Terminée</option>
                        </select>
                    </div>
                </div>

                <div class="flex gap-3 pt-4 border-t border-gray-700">
                    <button type="submit" id="submit-btn" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg">Enregistrer</button>
                    <a href="/admin/advertisements/index.html" class="px-5 py-2.5 bg-gray-700 hover:bg-gray-600 text-white text-sm font-medium rounded-lg">Annuler</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { requireAuth } from '../assets/js/auth.js';
        import api from '../assets/js/api.js';

        requireAuth();
        fetch('/admin/components/sidebar.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar-container').innerHTML = html;
        });

        const id = new URLSearchParams(window.location.search).get('id');
        if (!id) window.location.href = '/admin/advertisements/index.html';

        const alertBox = document.getElementById('alert');
        const submitBtn = document.getElementById('submit-btn');

        function showAlert(msg, type = 'error') {
            alertBox.classList.remove('hidden');
            alertBox.className = `mb-6 p-4 rounded-lg text-sm ${type === 'success' ? 'bg-green-800 text-green-100' : 'bg-red-800 text-red-100'}`;
            alertBox.textContent = msg;
        }

        async function load() {
            try {
                const res = await api.get(`/admin/advertisements/${id}`).catch(() => api.get(`/advertisements/${id}`));
                const ad = res.data.data || res.data;
                document.getElementById('title').value = ad.title || '';
                document.getElementById('description').value = ad.description || '';
                document.getElementById('format').value = ad.format || '';
                document.getElementById('status').value = ad.status || 'draft';
            } catch (e) {
                showAlert('Impossible de charger la publicité');
            }
        }

        document.getElementById('edit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Enregistrement...';

            const data = {
                title: document.getElementById('title').value.trim(),
                description: document.getElementById('description').value.trim() || null,
                format: document.getElementById('format').value.trim() || null,
                status: document.getElementById('status').value,
            };

            try {
                await api.put(`/admin/advertisements/${id}`, data).catch(() => api.put(`/advertisements/${id}`, data));
                showAlert('Publicité mise à jour', 'success');
                setTimeout(() => window.location.href = '/admin/advertisements/index.html', 1000);
            } catch (error) {
                showAlert(error.response?.data?.message || 'Erreur');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Enregistrer';
            }
        });

        load();
    </script>
</body>
</html>
