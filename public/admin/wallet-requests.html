<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demandes de dépôt - TruckAll Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-900 text-gray-100">
    <div id="sidebar-container"></div>

    <div class="p-4 sm:ml-64">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-white">Demandes de dépôt</h1>
            <p class="text-sm text-gray-400">Validez ou refusez les demandes de dépôt des annonceurs</p>
        </div>

        <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
            <table class="w-full text-sm text-left text-gray-300">
                <thead class="text-xs text-gray-400 uppercase bg-gray-700/50">
                    <tr>
                        <th class="px-6 py-3">Annonceur</th>
                        <th class="px-6 py-3">Montant</th>
                        <th class="px-6 py-3">Note</th>
                        <th class="px-6 py-3">Date</th>
                        <th class="px-6 py-3">Statut</th>
                        <th class="px-6 py-3 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="6" class="px-6 py-8 text-center text-gray-400">Chargement...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { requireAuth } from '../assets/js/auth.js';
        import api from '../assets/js/api.js';

        requireAuth();
        fetch('/admin/components/sidebar.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar-container').innerHTML = html;
        });

        function badge(status) {
            const normalized = String(status || 'pending').toLowerCase();
            const map = {
                pending: 'bg-yellow-600/20 text-yellow-300 border border-yellow-600/40',
                approved: 'bg-emerald-600/20 text-emerald-300 border border-emerald-600/40',
                rejected: 'bg-red-600/20 text-red-300 border border-red-600/40'
            };
            const labels = { pending: 'En attente', approved: 'Approuvée', rejected: 'Refusée' };
            return `<span class="px-2.5 py-1 rounded-full text-xs font-medium ${map[normalized] || 'bg-gray-600/20 text-gray-300 border border-gray-600/40'}">${labels[normalized] || normalized}</span>`;
        }

        async function load() {
            try {
                const res = await api.get('/admin/wallet/requests');
                const items = res.data.data || res.data || [];
                const tbody = document.getElementById('table-body');

                if (!items.length) {
                    tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-8 text-center text-gray-400">Aucune demande</td></tr>`;
                    return;
                }

                tbody.innerHTML = items.map(r => {
                    const status = String(r.results?.status || r.status || 'pending').toLowerCase();
                    const amount = Number(r.filters?.amount || r.amount || 0);
                    const note = r.description || r.note || '—';
                    const advertiserName = r.advertiser?.name || r.user?.name || r.user_id || '—';
                    const createdAt = r.created_at ? new Date(r.created_at).toLocaleString('fr-FR', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
                    const canAct = status === 'pending';

                    return `
                        <tr class="border-b border-gray-700/70 hover:bg-gray-700/40">
                            <td class="px-6 py-4">
                                <div class="font-medium text-white">${advertiserName}</div>
                                <div class="text-xs text-gray-500">ID ${r.id}</div>
                            </td>
                            <td class="px-6 py-4 font-semibold text-white">${new Intl.NumberFormat('fr-FR').format(amount)} FBU</td>
                            <td class="px-6 py-4 text-sm text-gray-300">${note}</td>
                            <td class="px-6 py-4 text-sm text-gray-400">${createdAt}</td>
                            <td class="px-6 py-4">${badge(status)}</td>
                            <td class="px-6 py-4 text-right">
                                ${canAct ? `
                                    <div class="flex justify-end gap-2">
                                        <button onclick="approve(${r.id})" class="rounded-lg border border-emerald-600/40 bg-emerald-600/10 px-3 py-1.5 text-sm font-medium text-emerald-300 transition hover:bg-emerald-600/20">Approuver</button>
                                        <button onclick="reject(${r.id})" class="rounded-lg border border-red-600/40 bg-red-600/10 px-3 py-1.5 text-sm font-medium text-red-300 transition hover:bg-red-600/20">Refuser</button>
                                    </div>
                                ` : '<span class="text-sm text-gray-500">Traité</span>'}
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (e) {
                document.getElementById('table-body').innerHTML =
                    `<tr><td colspan="6" class="px-6 py-8 text-center text-red-400">Erreur de chargement</td></tr>`;
            }
        }

        window.approve = async function(id) {
            if (!confirm('Approuver cette demande et créditer le portefeuille ?')) return;
            try {
                await api.post(`/admin/wallet/requests/${id}/approve`);
                await load();
            } catch (e) {
                alert(e.response?.data?.message || 'Erreur lors de l\'approbation');
            }
        };

        window.reject = async function(id) {
            if (!confirm('Refuser cette demande ?')) return;
            try {
                await api.post(`/admin/wallet/requests/${id}/reject`);
                await load();
            } catch (e) {
                alert(e.response?.data?.message || 'Erreur lors du refus');
            }
        };

        load();
    </script>
</body>
</html>
