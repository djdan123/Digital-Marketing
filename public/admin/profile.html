<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon profil - TruckAll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-900 text-gray-100">
    <div id="sidebar-container"></div>

    <div class="p-4 sm:ml-64">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-white">Mon profil</h1>
        </div>

        <div class="bg-gray-800 rounded-lg border border-gray-700 p-6 max-w-xl">
            <div class="flex items-center gap-4 mb-6">
                <img id="avatar" class="w-16 h-16 rounded-full" src="" alt="Avatar">
                <div>
                    <h2 id="user-name" class="text-xl font-semibold text-white">—</h2>
                    <p id="user-email" class="text-sm text-gray-400">—</p>
                </div>
            </div>

            <button id="logout-btn" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-sm rounded-lg">
                Se déconnecter
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { requireAuth, getUser, logout } from './assets/js/auth.js';

        requireAuth();
        fetch('/admin/components/sidebar.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar-container').innerHTML = html;
        });

        const user = getUser();
        if (user) {
            document.getElementById('user-name').textContent = user.name || 'Utilisateur';
            document.getElementById('user-email').textContent = user.email || '';
            document.getElementById('avatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name || 'U')}&background=3b82f6&color=fff`;
        }

        document.getElementById('logout-btn').addEventListener('click', logout);
    </script>
</body>
</html>
