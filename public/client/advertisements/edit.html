<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modifier une publicité - TruckAll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="sidebar-container"></div>
    <main class="p-4 sm:ml-64 min-h-screen">
        <a href="/client/advertisements/index.html" class="mb-6 inline-block text-sm text-blue-400 hover:underline">← Retour aux publicités</a>
        <div class="rounded-2xl border border-slate-800 bg-slate-900 p-6 shadow-lg shadow-black/20">
            <h1 class="text-2xl font-semibold text-white">Modifier la publicité</h1>
            <form id="edit-form" class="mt-6 space-y-5">
                <div>
                    <label class="mb-2 block text-sm font-medium text-slate-300">Titre</label>
                    <input id="title" type="text" required class="block w-full rounded-lg border border-slate-700 bg-slate-800 p-2.5 text-sm text-slate-100" />
                </div>
                <div>
                    <label class="mb-2 block text-sm font-medium text-slate-300">Description</label>
                    <textarea id="description" rows="4" class="block w-full rounded-lg border border-slate-700 bg-slate-800 p-2.5 text-sm text-slate-100"></textarea>
                </div>
                <div id="alert" class="hidden rounded-lg border border-slate-700 bg-slate-800 p-3 text-sm text-slate-300"></div>
                <button id="submit-btn" type="submit" class="inline-flex items-center justify-center gap-2 rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-blue-600/20 transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60">
                    <span class="submit-label">Enregistrer</span>
                </button>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { requireAuth, logout } from '../../assets/js/auth.js';
        import api from '../../assets/js/api.js';
        requireAuth();

        fetch('/layouts/sidebar-client.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar-container').innerHTML = html;
            document.getElementById('logout-btn')?.addEventListener('click', logout);
        });

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        async function loadAd() {
            try {
                const res = await api.get(`/advertiser/advertisements/${id}`).catch(() => api.get(`/advertisements/${id}`));
                const ad = res.data.data || res.data || {};
                document.getElementById('title').value = ad.title || '';
                document.getElementById('description').value = ad.description || '';
            } catch (e) {
                document.getElementById('alert').classList.remove('hidden');
                document.getElementById('alert').textContent = 'Impossible de charger cette publicité.';
            }
        }

        document.getElementById('edit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="inline-flex items-center gap-2"><svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v3a5 5 0 00-5 5H4z"></path></svg><span>Enregistrement…</span></span>';
            try {
                await api.put(`/advertiser/advertisements/${id}`, {
                    title: document.getElementById('title').value.trim(),
                    description: document.getElementById('description').value.trim()
                }).catch(() => api.post(`/advertisements/${id}`, { _method: 'PUT', title: document.getElementById('title').value.trim(), description: document.getElementById('description').value.trim() }));
                window.location.href = '/client/advertisements/index.html';
            } catch (error) {
                document.getElementById('alert').classList.remove('hidden');
                document.getElementById('alert').textContent = error.response?.data?.message || 'Erreur lors de la mise à jour';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span class="submit-label">Enregistrer</span>';
            }
        });

        loadAd();
    </script>
</body>
</html>
