<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mes publicités - TruckAll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="sidebar-container"></div>
    <main class="p-4 sm:ml-64 min-h-screen">
        <div class="mb-8 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
            <div>
                <h1 class="text-2xl font-semibold text-white">Mes publicités</h1>
                <p class="mt-1 text-sm text-slate-400">Consultez et gérez vos annonces.</p>
            </div>
            <a href="/client/advertisements/create.html" class="inline-flex items-center rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-lg shadow-blue-600/20 transition hover:bg-blue-700">+ Nouvelle publicité</a>
        </div>

        <div id="ads-list" class="space-y-4"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { requireAuth, logout } from '../../assets/js/auth.js';
        import api from '../../assets/js/api.js';
        requireAuth();

        fetch('/layouts/sidebar-client.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar-container').innerHTML = html;
            document.getElementById('logout-btn')?.addEventListener('click', logout);
        });

        async function loadAds() {
            try {
                const res = await api.get('/advertiser/advertisements').catch(() => api.get('/advertisements'));
                const items = res.data.data || res.data || [];
                const container = document.getElementById('ads-list');
                if (!items.length) {
                    container.innerHTML = '<div class="rounded-xl border border-slate-800 bg-slate-900 p-8 text-center text-slate-500">Aucune publicité pour le moment.</div>';
                    return;
                }

                container.innerHTML = items.map(ad => `
                    <div class="rounded-2xl border border-slate-800 bg-slate-900 p-5 shadow-lg shadow-black/20">
                        <div class="flex flex-wrap items-start justify-between gap-3">
                            <div>
                                <h2 class="text-lg font-semibold text-white">${ad.title || 'Annonce'}</h2>
                                <p class="mt-1 text-sm text-slate-400">${ad.description || 'Aucune description'}</p>
                            </div>
                            <span class="rounded-full bg-slate-700 px-3 py-1 text-xs text-slate-300">${ad.status || 'pending'}</span>
                        </div>
                        <div class="mt-4 flex flex-wrap gap-3">
                            <a href="/client/advertisements/edit.html?id=${ad.id}" class="text-sm text-blue-400 hover:underline">Modifier</a>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('ads-list').innerHTML = '<div class="rounded-xl border border-red-800 bg-red-900/20 p-6 text-red-300">Impossible de charger les publicités.</div>';
            }
        }

        loadAds();
    </script>
</body>
</html>
