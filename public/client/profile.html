<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mon profil - TruckAll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="sidebar-container"></div>
    <main class="p-4 sm:ml-64 min-h-screen">
        <div class="mb-8">
            <h1 class="text-2xl font-semibold text-white">Mon profil</h1>
            <p class="mt-1 text-sm text-slate-400">Gérez vos informations personnelles et votre sécurité.</p>
        </div>

        <div class="rounded-2xl border border-slate-800 bg-slate-900 p-6 shadow-lg shadow-black/20">
            <form id="profile-form" class="space-y-5">
                <div class="grid gap-4 md:grid-cols-2">
                    <div>
                        <label class="mb-2 block text-sm font-medium text-slate-300">Nom</label>
                        <input id="name" type="text" class="block w-full rounded-lg border border-slate-700 bg-slate-800 p-2.5 text-sm text-slate-100" />
                    </div>
                    <div>
                        <label class="mb-2 block text-sm font-medium text-slate-300">Email</label>
                        <input id="email" type="email" class="block w-full rounded-lg border border-slate-700 bg-slate-800 p-2.5 text-sm text-slate-100" />
                    </div>
                </div>
                <div id="alert" class="hidden rounded-lg border border-slate-700 bg-slate-800 p-3 text-sm text-slate-300"></div>
                <button id="submit-btn" type="submit" class="inline-flex items-center justify-center gap-2 rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-blue-600/20 transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60">
                    <span class="submit-label">Enregistrer</span>
                </button>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { requireAuth, logout, getUser } from '../assets/js/auth.js';
        import api from '../assets/js/api.js';
        requireAuth();

        fetch('/layouts/sidebar-client.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar-container').innerHTML = html;
            document.getElementById('logout-btn')?.addEventListener('click', logout);
        });

        const populateProfile = async () => {
            try {
                const response = await api.get('/advertiser/profile');
                const profile = response.data?.data;
                if (profile) {
                    document.getElementById('name').value = profile.name || '';
                    document.getElementById('email').value = profile.email || '';
                    const currentUser = getUser() || {};
                    localStorage.setItem('user', JSON.stringify({ ...currentUser, ...profile }));
                }
            } catch (error) {
                const user = getUser();
                if (user) {
                    document.getElementById('name').value = user.name || '';
                    document.getElementById('email').value = user.email || '';
                }
            }
        };

        await populateProfile();

        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="inline-flex items-center gap-2"><svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v3a5 5 0 00-5 5H4z"></path></svg><span>Enregistrement…</span></span>';
            const alert = document.getElementById('alert');
            alert.classList.add('hidden');
            try {
                const response = await api.put('/advertiser/profile', {
                    name: document.getElementById('name').value.trim(),
                    email: document.getElementById('email').value.trim()
                });
                const profile = response.data?.data;
                if (profile) {
                    const currentUser = getUser() || {};
                    localStorage.setItem('user', JSON.stringify({ ...currentUser, ...profile }));
                }
                alert.classList.remove('hidden');
                alert.textContent = response.data?.message || 'Profil mis à jour.';
            } catch (error) {
                alert.classList.remove('hidden');
                alert.textContent = error.response?.data?.message || 'Impossible de mettre à jour le profil.';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span class="submit-label">Enregistrer</span>';
            }
        });
    </script>
</body>
</html>
