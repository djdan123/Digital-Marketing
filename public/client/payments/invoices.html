<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factures - TruckAll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="sidebar-container"></div>
    <main class="p-4 sm:ml-64 min-h-screen">
        <div class="mb-6">
            <a href="/client/payments/index.html" class="inline-block text-sm text-blue-400 hover:underline">← Retour aux paiements</a>
            <h1 class="mt-3 text-2xl font-semibold text-white">Factures</h1>
            <p class="mt-1 text-sm text-slate-400">Téléchargez ou consultez vos justificatifs de paiement.</p>
        </div>

        <div id="invoices-list" class="space-y-4"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { requireAuth, logout } from '../../assets/js/auth.js';
        import api from '../../assets/js/api.js';
        requireAuth();

        fetch('/layouts/sidebar-client.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar-container').innerHTML = html;
            document.getElementById('logout-btn')?.addEventListener('click', logout);
        });

        async function loadInvoices() {
            try {
                const res = await api.get('/advertiser/payments');
                const items = res.data.data || res.data || [];
                const container = document.getElementById('invoices-list');
                if (!items.length) {
                    container.innerHTML = '<div class="rounded-xl border border-slate-800 bg-slate-900 p-8 text-center text-slate-500">Aucune facture disponible.</div>';
                    return;
                }

                container.innerHTML = items.map(item => `
                    <div class="rounded-2xl border border-slate-800 bg-slate-900 p-5 shadow-lg shadow-black/20">
                        <div class="flex flex-wrap items-center justify-between gap-3">
                            <div>
                                <p class="text-lg font-semibold text-white">Facture ${item.reference || item.id}</p>
                                <p class="mt-1 text-sm text-slate-400">Paiement ${item.status || 'en attente'}</p>
                            </div>
                            <a href="#" class="rounded-lg border border-slate-700 px-3 py-2 text-sm text-slate-300 hover:border-blue-500 hover:text-white">Télécharger</a>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('invoices-list').innerHTML = '<div class="rounded-xl border border-red-800 bg-red-900/20 p-6 text-red-300">Impossible de charger les factures.</div>';
            }
        }

        loadInvoices();
    </script>
</body>
</html>
