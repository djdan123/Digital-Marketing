<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Détail campagne - TruckAll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="sidebar-container"></div>
    <main class="p-4 sm:ml-64 min-h-screen">
        <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
            <a href="/client/campaigns/index.html" class="inline-block text-sm text-blue-400 hover:underline">← Retour aux campagnes</a>
            <a href="/client/messages.html" class="rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-300 hover:border-blue-500 hover:text-white">Workflow & messages</a>
        </div>
        <div id="campaign-card" class="rounded-2xl border border-slate-800 bg-slate-900 p-6 shadow-lg shadow-black/20"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { requireAuth, logout } from '../../assets/js/auth.js';
        import api from '../../assets/js/api.js';

        requireAuth();
        fetch('/layouts/sidebar-client.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar-container').innerHTML = html;
            document.getElementById('logout-btn')?.addEventListener('click', logout);
        });

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        function mediaPreview(ad) {
            const url = ad.file_url || ad.meta?.file_url || (ad.file_path ? `/storage/${ad.file_path}` : null);
            if (!url) {
                return '<p class="text-sm text-slate-500">Aperçu du média indisponible.</p>';
            }

            const format = String(ad.format || ad.uploaded_type || '').toLowerCase();
            const mime = String(ad.mime || ad.meta?.mime || '').toLowerCase();
            const isVideo = format === 'video' || mime.startsWith('video/');
            const isAudio = format === 'audio' || mime.startsWith('audio/');

            if (isVideo) {
                return `<video controls class="w-full max-h-[420px] rounded-xl border border-slate-800 bg-black"><source src="${url}"></video>`;
            }

            if (isAudio) {
                return `<audio controls class="w-full"><source src="${url}"></audio>`;
            }

            return `<img src="${url}" alt="Média de la campagne" class="w-full rounded-xl border border-slate-800 object-cover" />`;
        }

        async function loadCampaign() {
            if (!id) {
                document.getElementById('campaign-card').innerHTML = '<p class="text-red-400">Campagne introuvable.</p>';
                return;
            }

            try {
                const res = await api.get(`/advertiser/campaigns/${id}`);
                const c = res.data.data || res.data || {};
                const ads = Array.isArray(c.advertisements) ? c.advertisements : [];
                document.getElementById('campaign-card').innerHTML = `
                    <div class="flex flex-wrap items-start justify-between gap-4">
                        <div>
                            <h1 class="text-2xl font-semibold text-white">${c.name || 'Campagne'}</h1>
                            <p class="mt-2 text-sm text-slate-400">${c.objective || 'Aucun objectif défini.'}</p>
                        </div>
                        <span class="rounded-full bg-blue-600/20 px-3 py-1 text-sm text-blue-300">${c.status || 'pending'}</span>
                    </div>
                    <div class="mt-6 grid gap-4 md:grid-cols-2">
                        <div class="rounded-lg border border-slate-800 bg-slate-800/60 p-4">
                            <p class="text-xs uppercase tracking-wide text-slate-400">Budget</p>
                            <p class="mt-2 text-xl font-semibold text-white">${new Intl.NumberFormat('fr-FR').format(c.budget || 0)} FBU</p>
                        </div>
                        <div class="rounded-lg border border-slate-800 bg-slate-800/60 p-4">
                            <p class="text-xs uppercase tracking-wide text-slate-400">Période</p>
                            <p class="mt-2 text-xl font-semibold text-white">${c.starts_at ? new Date(c.starts_at).toLocaleDateString('fr-FR') : '—'} → ${c.ends_at ? new Date(c.ends_at).toLocaleDateString('fr-FR') : '—'}</p>
                        </div>
                    </div>
                    <div class="mt-6 rounded-2xl border border-slate-800 bg-slate-950/60 p-5">
                        <h2 class="text-lg font-semibold text-white">Média uploadé</h2>
                        <p class="mt-1 text-sm text-slate-400">Voici le contenu associé à cette campagne.</p>
                        <div class="mt-4 space-y-4">
                            ${ads.length ? ads.map(ad => `
                                <div class="rounded-xl border border-slate-800 bg-slate-900 p-4">
                                    <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
                                        <div>
                                            <p class="font-medium text-white">${ad.title || 'Annonce'}</p>
                                            <p class="text-xs text-slate-500">${ad.description || '—'}</p>
                                        </div>
                                        <span class="rounded-full bg-slate-800 px-2.5 py-1 text-xs text-slate-300">${ad.format || 'media'}</span>
                                    </div>
                                    <div class="overflow-hidden rounded-xl">${mediaPreview(ad)}</div>
                                </div>
                            `).join('') : '<p class="text-sm text-slate-500">Aucun média uploadé pour cette campagne.</p>'}
                        </div>
                    </div>
                `;
            } catch (error) {
                document.getElementById('campaign-card').innerHTML = '<p class="text-red-400">Impossible de charger cette campagne.</p>';
            }
        }

        loadCampaign();
    </script>
</body>
</html>
