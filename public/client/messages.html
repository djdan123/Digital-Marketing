<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages et workflow - TruckAll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="sidebar-container"></div>
    <main class="p-4 sm:ml-64 min-h-screen">
        <div class="mb-8">
            <h1 class="text-2xl font-semibold text-white">Messages & workflow</h1>
            <p class="mt-1 text-sm text-slate-400">Suivez les échanges autour de vos campagnes et de leurs validations.</p>
        </div>

        <div class="grid gap-6 lg:grid-cols-[1.1fr_0.9fr]">
            <div class="rounded-2xl border border-slate-800 bg-slate-900 p-6 shadow-lg shadow-black/20">
                <div class="flex items-start justify-between gap-3">
                    <div>
                        <h2 class="text-lg font-semibold text-white">Workflow opérationnel</h2>
                        <p class="mt-1 text-sm text-slate-400">Vue synthétique des prochaines étapes de validation et de diffusion.</p>
                    </div>
                    <div class="rounded-full bg-blue-600/20 px-3 py-1 text-xs font-medium text-blue-300">Live</div>
                </div>
                <div class="mt-5 space-y-3" id="workflow-list"></div>
                <div class="mt-4 rounded-xl border border-slate-800 bg-slate-800/50 p-4">
                    <p class="text-sm font-medium text-white">Actions prioritaires</p>
                    <div class="mt-3 flex flex-wrap gap-2">
                        <a href="/client/campaigns/index.html" class="rounded-full border border-slate-700 px-3 py-1 text-xs text-slate-300 hover:border-blue-500 hover:text-white">Voir campagnes</a>
                        <a href="/client/advertisements/index.html" class="rounded-full border border-slate-700 px-3 py-1 text-xs text-slate-300 hover:border-blue-500 hover:text-white">Voir publicités</a>
                        <a href="/client/wallet.html" class="rounded-full border border-slate-700 px-3 py-1 text-xs text-slate-300 hover:border-blue-500 hover:text-white">Recharger le portefeuille</a>
                    </div>
                </div>
            </div>
            <div class="rounded-2xl border border-slate-800 bg-slate-900 p-6 shadow-lg shadow-black/20">
                <h2 class="text-lg font-semibold text-white">Messages</h2>
                <div class="mt-5 space-y-3" id="messages-list"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { requireAuth, logout } from '../assets/js/auth.js';
        import api from '../assets/js/api.js';
        requireAuth();

        fetch('/layouts/sidebar-client.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar-container').innerHTML = html;
            document.getElementById('logout-btn')?.addEventListener('click', logout);
        });

        async function loadWorkflow() {
            try {
                const [campaignRes, adRes] = await Promise.all([
                    api.get('/advertiser/campaigns').catch(() => ({ data: { data: [] } })),
                    api.get('/advertiser/advertisements').catch(() => ({ data: { data: [] } }))
                ]);
                const campaigns = campaignRes.data.data || campaignRes.data || [];
                const ads = adRes.data.data || adRes.data || [];

                const workflow = [
                    ...campaigns.slice(0, 3).map(item => ({ title: `Campagne ${item.name || '—'}`, state: item.status || 'pending', detail: 'En attente de validation' })),
                    ...ads.slice(0, 3).map(item => ({ title: `Publicité ${item.title || '—'}`, state: item.status || 'pending', detail: 'Prête à diffuser' }))
                ];

                document.getElementById('workflow-list').innerHTML = workflow.length ? workflow.map((step, index) => `
                    <div class="rounded-lg border border-slate-800 bg-slate-800/50 p-3">
                        <div class="flex items-center justify-between gap-3">
                            <div class="flex items-center gap-3">
                                <span class="flex h-7 w-7 items-center justify-center rounded-full bg-blue-600/20 text-sm font-semibold text-blue-300">${index + 1}</span>
                                <div>
                                    <p class="text-sm font-medium text-white">${step.title}</p>
                                    <p class="mt-1 text-xs text-slate-400">${step.detail}</p>
                                </div>
                            </div>
                            <span class="rounded-full bg-blue-600/20 px-2.5 py-1 text-xs text-blue-300">${step.state}</span>
                        </div>
                    </div>
                `).join('') : '<p class="text-sm text-slate-500">Aucun workflow à afficher.</p>';
            } catch {
                document.getElementById('workflow-list').innerHTML = '<p class="text-sm text-red-400">Chargement du workflow impossible.</p>';
            }
        }

        async function loadMessages() {
            const messages = [
                { title: 'Validation média', body: 'Votre média a bien été reçu et est en cours d’analyse.' },
                { title: 'Campagne planifiée', body: 'La campagne sera diffusée selon le planning défini.' },
                { title: 'Paiement reçu', body: 'Le paiement associé à votre dernier lot a été traité.' }
            ];
            document.getElementById('messages-list').innerHTML = messages.map(message => `
                <div class="rounded-lg border border-slate-800 bg-slate-800/40 p-3">
                    <p class="text-sm font-medium text-white">${message.title}</p>
                    <p class="mt-2 text-xs text-slate-400">${message.body}</p>
                </div>
            `).join('');
        }

        loadWorkflow();
        loadMessages();
    </script>
</body>
</html>
