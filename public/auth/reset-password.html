<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Réinitialisation du mot de passe - TruckAll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#2563eb', 600: '#1d4ed8', 700: '#1e40af' }
                    }
                }
            }
        };
    </script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="flex min-h-screen items-center justify-center px-4 py-10">
        <div class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900 p-8 shadow-2xl shadow-black/30">
            <div class="mb-6 text-center">
                <a href="/auth/login.html" class="text-2xl font-semibold text-blue-400">TruckAll</a>
                <p class="mt-2 text-sm text-slate-400">Créer un nouveau mot de passe</p>
            </div>

            <div id="alert" class="mb-4 hidden rounded-lg border border-slate-700 bg-slate-800 p-3 text-sm text-slate-300"></div>

            <form id="reset-form" class="space-y-5">
                <input type="hidden" id="token" />
                <div>
                    <label for="email" class="mb-2 block text-sm font-medium text-slate-200">Adresse email</label>
                    <input id="email" name="email" type="email" required
                        class="block w-full rounded-lg border border-slate-700 bg-slate-800 p-2.5 text-sm text-slate-100 placeholder:text-slate-400 focus:border-blue-500 focus:ring-blue-500" />
                </div>
                <div>
                    <label for="password" class="mb-2 block text-sm font-medium text-slate-200">Nouveau mot de passe</label>
                    <input id="password" name="password" type="password" required
                        class="block w-full rounded-lg border border-slate-700 bg-slate-800 p-2.5 text-sm text-slate-100 placeholder:text-slate-400 focus:border-blue-500 focus:ring-blue-500" />
                </div>
                <div>
                    <label for="password_confirmation" class="mb-2 block text-sm font-medium text-slate-200">Confirmer le mot de passe</label>
                    <input id="password_confirmation" name="password_confirmation" type="password" required
                        class="block w-full rounded-lg border border-slate-700 bg-slate-800 p-2.5 text-sm text-slate-100 placeholder:text-slate-400 focus:border-blue-500 focus:ring-blue-500" />
                </div>

                <button id="submit-btn" type="submit"
                    class="w-full rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-500/30">
                    Réinitialiser
                </button>
            </form>

            <p class="mt-6 text-center text-sm text-slate-400">
                <a href="/auth/login.html" class="font-medium text-blue-400 hover:underline">Retour à la connexion</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import api from '../assets/js/api.js';
        const form = document.getElementById('reset-form');
        const alertBox = document.getElementById('alert');
        const submitBtn = document.getElementById('submit-btn');
        const tokenInput = document.getElementById('token');

        const params = new URLSearchParams(window.location.search);
        tokenInput.value = params.get('token') || '';

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Réinitialisation...';
            alertBox.classList.add('hidden');

            try {
                await api.post('/reset-password', {
                    token: tokenInput.value,
                    email: document.getElementById('email').value.trim(),
                    password: document.getElementById('password').value,
                    password_confirmation: document.getElementById('password_confirmation').value
                });

                alertBox.className = 'mb-4 rounded-lg border border-emerald-700 bg-emerald-900/40 p-3 text-sm text-emerald-300';
                alertBox.textContent = 'Mot de passe mis à jour avec succès. Vous pouvez vous reconnecter.';
                alertBox.classList.remove('hidden');
                form.reset();
            } catch (error) {
                alertBox.className = 'mb-4 rounded-lg border border-red-700 bg-red-900/40 p-3 text-sm text-red-300';
                alertBox.textContent = error.response?.data?.message || 'La réinitialisation a échoué.';
                alertBox.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Réinitialiser';
            }
        });
    </script>
</body>
</html>
