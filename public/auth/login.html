<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - TruckAll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-50">

    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="w-full max-w-md">
            <div class="text-center mb-8">
                <a href="/index.html" class="text-3xl font-bold text-blue-600">TruckAll</a>
                <p class="text-gray-600 mt-2">Connectez-vous à votre espace client</p>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
                <div id="alert" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

                <form id="login-form" class="space-y-5">
                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-900">Email</label>
                        <input type="email" id="email" required class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="vous@email.com">
                    </div>
                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-900">Mot de passe</label>
                        <input type="password" id="password" required class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
                    </div>
                    <div class="flex items-center justify-between">
                        <a href="/auth/forgot-password.html" class="text-sm text-blue-600 hover:underline">Mot de passe oublié ?</a>
                    </div>
                    <button type="submit" id="submit-btn" class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5">
                        Se connecter
                    </button>
                </form>

                <p class="mt-6 text-center text-sm text-gray-600">
                    Pas encore de compte ?
                    <a href="/auth/register.html" class="text-blue-600 hover:underline font-medium">S’inscrire</a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module">
        import { login, requireGuest } from '../assets/js/auth.js';

        requireGuest();

        const form = document.getElementById('login-form');
        const alertBox = document.getElementById('alert');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Connexion...';
            alertBox.classList.add('hidden');

                const result = await login(
                    document.getElementById('email').value.trim(),
                    document.getElementById('password').value
                );

                if (result.success) {
                    const user = result.user;
                    if (user.role === 'admin') {
                        window.location.href = '/admin/index.html';
                    } else if (user.role === 'media_manager' || user.role === 'mediamanager') {
                        window.location.href = '/mediamanager/index.html';
                    } else {
                        window.location.href = '/client/dashboard.html';
                    }
                } else {
                    alertBox.classList.remove('hidden');
                    alertBox.className = 'mb-4 p-3 rounded-lg text-sm bg-red-50 text-red-700 border border-red-200';
                    alertBox.textContent = result.message || 'Email ou mot de passe incorrect';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Se connecter';
                }
        });
    </script>
</body>
</html>
